name: SIMAB secure wallet end-to-end DB and UI
on:
  pull_request:
    paths:
      - 'supabase/**'
      - 'wallet/**'
      - 'games/**'
      - 'swap/**'
      - 'assets/js/**'
      - 'assets/css/**'
      - 'index.html'
      - 'friends/**'
      - 'offers/**'
      - 'streak/**'
      - 'quests/**'
      - 'package*.json'
      - 'admin/**'
      - 'assets/js/simab-central-quests.js'
      - 'assets/js/simab-secure-wallet.js'
      - 'tests/**'
      - '.github/workflows/simab-secure-wallet-integration.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  wallet-integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: simab-ci
          POSTGRES_DB: simab_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d simab_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: simab-ci
      PGDATABASE: simab_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned integration test dependency
        run: npm ci
      - name: Test actual signed HTTP API against transactional PostgreSQL
        run: npm run test:server
      - name: Browser and Edge static syntax and behavior checks
        run: node --check assets/js/simab-secure-wallet.js && node --test tests/*.test.mjs
      - name: Install Chromium for mobile UI checks
        run: npx playwright install --with-deps chromium
      - name: Mobile tasks, all bot practices, reward design and management isolation
        run: node tests/ui-refresh-v17.mjs
      - name: Selected game setup, Hokm variants and wallet visibility
        run: node tests/ui-room-setup-v19.mjs
      - name: Video regressions - invitation recovery, ready table, bot pacing and rewards
        run: node tests/ui-video-regressions-v20.mjs
      - name: Seven Cards legacy and two-card transition controls and capability preflight
        run: node tests/ui-sevens-transition-v22.mjs
      - name: Management API security and private table grants
        run: node --test tests/security-v17-integration.mjs
      - name: Verify new games and poker UI in portrait and landscape
        run: node tests/ui-v13.mjs
      - name: Two real seats, invitation, live audio and optional cameras
        run: node tests/ui-private-poker.mjs
      - name: Wallet layout, server-confirmed Stars and offer UI
        run: node tests/ui-shop-v15.mjs
      - name: All friends games, safe areas and real two-way voice
        run: node tests/ui-party-v16.mjs
      - name: Screenshot regression cases v21
        run: node tests/ui-screenshot-regressions-v21.mjs
      - name: Dice results, numbered pawns, active seat and table direction
        run: node tests/ui-dice-board-v22.mjs
      - name: Phase 1 isolated Ludo, setup, rotation, insets and sound regressions
        run: node tests/ui-phase1-v22.mjs
      - name: Phase 2A isolated slot Stop, paytable, backgammon dice and sound regressions
        run: node tests/ui-phase2a-v22.mjs
      - name: Phase 2BC isolated fairness, stale response and animation regressions
        run: node tests/ui-phase2bc-v22.mjs
      - name: English default and persistent Persian language choice
        run: node tests/ui-language-v16.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: simab-v13-mobile-screenshots
          path: /tmp/simab-*.png
      - name: Install PostgreSQL client
        run: sudo apt-get update -qq && sudo apt-get install -y postgresql-client
      - name: Prepare Supabase-style database roles
        run: |
          psql -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE anon NOLOGIN;
          CREATE ROLE authenticated NOLOGIN;
          CREATE ROLE service_role NOLOGIN BYPASSRLS;
          SQL
      - name: Execute ALL migrations and real SQL integration checks
        run: |
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261012_central_quests_admins.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261012_verified_quest_rewards.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261013_secure_wallet_games.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261025074103_admin_wallet_credit.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261025081053_unified_wallet_game_sessions.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261026084226_table_games_v13.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261026091612_private_poker_rooms.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261026100658_shop_and_channel_offers.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261026135953_party_rooms_and_timed_tasks.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261028090000_wallet_unbiased_random.sql
          psql -v ON_ERROR_STOP=1 -f tests/integration-phase2bc.sql
          psql -v ON_ERROR_STOP=1 -f tests/integration-secure-wallet.sql
          psql -v ON_ERROR_STOP=1 -f tests/integration-admin-credit.sql
          psql -v ON_ERROR_STOP=1 -f tests/integration-unified-wallet.sql
