name: SIMAB verified rewards security checks
on:
  push:
    branches:
      - feature/verified-quest-rewards-20261012
  pull_request:
    paths:
      - 'supabase/**'
      - 'assets/js/simab-central-quests.js'
      - 'admin/index.html'
      - 'quests/index.html'
      - 'tests/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check assets/js/simab-central-quests.js
      - run: node --test tests/*.test.mjs
