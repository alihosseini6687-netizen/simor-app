name: Deploy SIMAB central quests to Supabase
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: simab-central-quests-deployment
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout verified main branch code
        uses: actions/checkout@v4

      - name: Confirm Supabase deployment credential exists
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        shell: bash
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Missing GitHub Actions secret SUPABASE_ACCESS_TOKEN. Add it in repository Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy ONLY the existing simab-central-quests function
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        shell: bash
        run: |
          supabase functions deploy simab-central-quests \
            --project-ref pwjlyryrrgbaprfnrieq \
            --no-verify-jwt

      - name: Check live function and public bot identity
        shell: bash
        run: |
          curl --fail --silent --show-error --retry 3 --retry-delay 2 \
            'https://pwjlyryrrgbaprfnrieq.supabase.co/functions/v1/simab-central-quests?health=1' \
            --output /tmp/simab-health.json
          python3 - <<'PY'
          import json
          with open('/tmp/simab-health.json', encoding='utf-8') as f:
              result = json.load(f)
          if result.get('ok') is not True:
              raise SystemExit('Edge Function did not pass health check')
          if result.get('botMatchesExpected') is not True:
              raise SystemExit('Function is configured for a different Telegram bot')
          print('Deployment verified: live function is healthy and bot identity matches.')
          PY
