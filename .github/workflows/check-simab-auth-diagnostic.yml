name: Test SIMAB Telegram Auth Diagnostics
on:
  push:
    branches: [fix/telegram-auth-diagnostic-20261012]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Syntax check
        run: node --check assets/js/simab-central-quests.js
      - name: Verify safe local-only 401 diagnostics and cache
        run: |
          node - <<'NODE'
          const fs=require('fs'), assert=require('assert');
          const s=fs.readFileSync('assets/js/simab-central-quests.js','utf8');
          assert(s.includes('describeTelegram401(initData)'));
          assert(s.includes('fields.get("auth_date")'));
          assert(s.includes('ageSeconds > 3600'));
          assert(!s.includes('console.log(initData)'));
          for(const file of ['admin/index.html','quests/index.html']) {
            assert(fs.readFileSync(file,'utf8').includes('simab-central-quests.js?v=3'));
          }
          console.log('SAFE AUTH DIAGNOSTICS OK');
          NODE
