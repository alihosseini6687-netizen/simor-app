name: SIMAB game-wide regression and wallet isolation
on:
  push:
    branches: [fix/gamewide-wallet-isolation-quality-20261012]
  pull_request:
    paths:
      - 'index.html'
      - 'swap/**'
      - 'games/**'
      - 'friends/**'
      - 'streak/**'
      - 'assets/js/simab-legacy-guard.js'
      - 'tests/gamewide-legacy-safety.test.mjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/*.test.mjs
