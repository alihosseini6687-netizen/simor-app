<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Smart Gaming Hub</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="css/main.css">
</head>
<body>

  <!-- هدر: اطلاعات کاربر و موجودی -->
  <header class="user-header">
    <div class="user-info">
      <span id="user-name">کاربر</span>
    </div>
    <div class="balance-box">
      <img src="assets/coin.png" alt="Coin" class="coin-icon">
      <span id="user-balance">0</span>
    </div>
  </header>

  <!-- بنر یا خوش‌آمدگویی -->
  <div class="banner">
    <img src="assets/banner.jpg" alt="Banner">
  </div>

  <!-- لابی بازی‌ها -->
  <main class="games-grid">
    <!-- کارت پوکر -->
    <div class="game-card" onclick="openGame('games/poker/index.html')">
      <img src="assets/poker-chip.png" alt="Poker">
      <h3>پوکر تگزاس</h3>
      <button class="btn-play">ورود به بازی</button>
    </div>

    <!-- کارت بازی بعدی (مثلاً رولت) -->
    <div class="game-card" onclick="openGame('games/roulette/index.html')">
      <img src="assets/chest.png" alt="Roulette">
      <h3>گردونه شانس / رولت</h3>
      <button class="btn-play">ورود به بازی</button>
    </div>
  </main>

  <script src="js/storage.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
