<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>مینی گیم و سرگرمی هوشمند</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: #0c0c10;
            --card-bg: #14141b;
            --gold-gradient: linear-gradient(135deg, #d4af37 0%, #f9e8a2 50%, #aa7c11 100%);
            --gold-color: #e5c158;
            --text-color: #ffffff;
            --text-muted: #8e8e98;
            --border-color: rgba(212, 175, 55, 0.28);
            --admin-color: #ff3b30;
            --green-color: #34c759;
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body {
            margin: 0; padding: 0 0 78px 0;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            min-height: 100vh;
        }
        .tab-content { display: none; padding: 14px; }
        .tab-content.active { display: block; animation: fadeIn 0.22s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }

        .gold-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 18px;
            padding: 16px;
            margin-bottom: 14px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.6);
            position: relative;
            overflow: hidden;
        }
        .gold-text {
            background: var(--gold-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: bold;
        }
        .gold-btn {
            background: var(--gold-gradient);
            color: #0b0b0e;
            border: none;
            border-radius: 12px;
            padding: 12px 18px;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
            width: 100%;
            box-shadow: 0 4px 15px rgba(212, 175, 55, 0.25);
            transition: all 0.15s;
        }
        .gold-btn:active { transform: scale(0.97); }
        .gold-btn:disabled {
            background: #2a2a34 !important;
            color: #666 !important;
            box-shadow: none !important;
            cursor: not-allowed;
        }

        .admin-card {
            background: rgba(255, 59, 48, 0.08);
            border: 1px dashed var(--admin-color);
            border-radius: 16px;
            padding: 14px;
            margin-bottom: 14px;
        }

        .bottom-nav {
            position: fixed;
            bottom: 0; left: 0; right: 0;
            height: 68px;
            background: rgba(14, 14, 19, 0.94);
            backdrop-filter: blur(16px);
            border-top: 1px solid var(--border-color);
            display: flex;
            justify-content: space-around;
            align-items: center;
            z-index: 1000;
        }
        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: var(--text-muted);
            font-size: 11px;
            font-weight: 500;
            cursor: pointer;
            flex: 1;
            height: 100%;
            transition: all 0.15s;
        }
        .nav-item.active {
            color: var(--gold-color);
            font-weight: bold;
        }
        .nav-item.tap-center {
            position: relative;
            top: -12px;
        }
        .tap-icon-circle {
            width: 52px; height: 52px;
            border-radius: 50%;
            background: var(--gold-gradient);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #0b0b0e;
            font-size: 24px;
            font-weight: 900;
            box-shadow: 0 4px 18px rgba(212, 175, 55, 0.45);
            border: 3px solid #0c0c10;
        }

        .features-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
        }
        .feat-card {
            background: var(--card-bg);
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 16px;
            padding: 14px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            cursor: pointer;
            transition: all 0.15s;
        }
        .feat-card:active { transform: scale(0.96); border-color: var(--gold-color); }
        .feat-card .f-icon { font-size: 26px; margin-bottom: 6px; }

        .wheel-container {
            position: relative;
            width: 270px; height: 270px;
            margin: 15px auto 20px auto;
        }
        #wheel-canvas {
            width: 100%; height: 100%;
            border-radius: 50%;
            border: 6px solid #d4af37;
            box-shadow: 0 0 35px rgba(212, 175, 55, 0.35);
        }
        .wheel-arrow {
            position: absolute;
            top: -10px; left: 50%;
            transform: translateX(-50%);
            width: 0; height: 0;
            border-left: 14px solid transparent;
            border-right: 14px solid transparent;
            border-top: 24px solid #ffffff;
            z-index: 10;
            filter: drop-shadow(0 3px 6px rgba(0,0,0,0.8));
        }

        .tap-stats-row {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin-bottom: 16px;
        }
        .tap-stat-box {
            background: var(--card-bg);
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 12px;
            padding: 10px 4px;
            text-align: center;
        }
        .tap-stat-label { font-size: 11px; color: var(--text-muted); margin-bottom: 4px; }
        .tap-stat-val { font-size: 16px; font-weight: bold; color: var(--gold-color); }

        .tap-main-balance {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin: 10px 0 20px 0;
        }
        .balance-s-coin {
            width: 38px; height: 38px;
            border-radius: 50%;
            background: var(--gold-gradient);
            color: #0b0b0e;
            font-size: 20px;
            font-weight: 900;
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 0 14px rgba(212, 175, 55, 0.4);
        }
        .balance-number { font-size: 38px; font-weight: 900; color: #fff; }

        .coin-wrapper {
            position: relative;
            width: 250px; height: 250px;
            margin: 10px auto 25px auto;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer;
            user-select: none;
            touch-action: manipulation;
        }
        .gold-coin {
            width: 100%; height: 100%;
            border-radius: 50%;
            background: radial-gradient(circle at 35% 35%, #fff5be 0%, #d4af37 40%, #996e08 85%, #594002 100%);
            box-shadow: 0 12px 40px rgba(212, 175, 55, 0.4), inset 0 4px 8px rgba(255,255,255,0.7), inset 0 -8px 16px rgba(0,0,0,0.7);
            border: 7px solid #f9e8a2;
            display: flex; align-items: center; justify-content: center;
            transition: transform 0.08s ease;
            position: relative;
        }
        .coin-inner-ring {
            width: 80%; height: 80%;
            border-radius: 50%;
            border: 3px dashed rgba(89, 64, 2, 0.7);
            display: flex; align-items: center; justify-content: center;
            background: radial-gradient(circle at 40% 40%, #e2be49 0%, #b88a1b 100%);
            box-shadow: inset 0 2px 6px rgba(0,0,0,0.4);
        }
        .coin-letter-s {
            font-size: 100px;
            font-weight: 900;
            color: #4a3400;
            text-shadow: 2px 2px 4px rgba(255, 255, 255, 0.6), -2px -2px 4px rgba(0, 0, 0, 0.5);
            font-family: Arial, sans-serif;
            line-height: 1;
        }
        .floating-plus {
            position: absolute;
            color: #ffffff;
            font-size: 26px;
            font-weight: 900;
            text-shadow: 0 0 10px #d4af37;
            pointer-events: none;
            animation: floatUp 0.8s ease-out forwards;
        }
        @keyframes floatUp {
            0% { opacity: 1; transform: translateY(0) scale(1); }
            100% { opacity: 0; transform: translateY(-70px) scale(1.3); }
        }

        .energy-bar-wrap { width: 100%; max-width: 320px; margin: 0 auto; }
        .energy-bar-bg {
            height: 10px; width: 100%;
            background: rgba(255,255,255,0.08);
            border-radius: 5px;
            overflow: hidden;
            margin-top: 6px;
        }
        .energy-bar-fill {
            height: 100%; width: 100%;
            background: var(--gold-gradient);
            border-radius: 5px;
            transition: width 0.15s ease;
        }

        .upgrade-card {
            background: var(--card-bg);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 16px;
            padding: 14px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 10px;
        }
        .upgrade-btn {
            background: var(--gold-gradient);
            color: #000;
            border: none;
            border-radius: 10px;
            padding: 8px 14px;
            font-weight: bold;
            font-size: 13px;
            cursor: pointer;
        }

        .task-card {
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.07);
            border-radius: 14px;
            padding: 12px 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }
        .task-info h4 { margin: 0 0 4px 0; font-size: 13px; color: #fff; }
        .task-info p { margin: 0; font-size: 11px; color: var(--gold-color); font-weight: bold; }
        .task-btn {
            background: var(--gold-gradient);
            color: #0b0b0e;
            border: none;
            border-radius: 10px;
            padding: 8px 14px;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
        }
        .task-btn.completed {
            background: rgba(52, 199, 89, 0.15);
            color: var(--green-color);
            border: 1px solid var(--green-color);
            cursor: default;
        }

        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(10px);
            z-index: 2000;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 18px;
        }
        .modal-box {
            background: #14141d;
            border: 1px solid var(--border-color);
            border-radius: 20px;
            width: 100%;
            max-width: 380px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            max-height: 90vh;
            overflow-y: auto;
        }
    </style>
</head>
<body>
