<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>صدور کارت هدیه بانکی</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg: #0c0c10;
      --card-bg: #14141b;
      --card-inner: #1a1a24;
      --gold: #e5c158;
      --gold-gradient: linear-gradient(135deg, #d4af37, #f9e8a2, #aa7c11);
      --text: #ffffff;
      --text-muted: #8e8e98;
      --border: rgba(212, 175, 55, 0.28);
      --green: #34c759;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; user-select: none; }
    body { background-color: var(--bg); color: var(--text); min-height: 100vh; padding: 12px; text-align: center; }

    /* هدر */
    .top-bar {
      display: flex; justify-content: space-between; align-items: center;
      background: var(--card-bg); border: 1px solid var(--border);
      border-radius: 12px; padding: 8px 12px; margin-bottom: 14px; font-size: 13px;
    }
    .btn-back {
      background: #252532; color: var(--gold); border: 1px solid var(--border);
      padding: 6px 12px; border-radius: 8px; font-weight: bold; cursor: pointer;
    }

    /* پیش‌نمایش کارت بانکی لوکس (نسبت استاندارد کارت اعتباری) */
    .card-preview-container {
      margin: 10px auto 16px; width: 100%; max-width: 330px;
    }
    .bank-card {
      width: 100%; height: 200px; border-radius: 16px; padding: 16px;
      position: relative; box-shadow: 0 12px 30px rgba(0,0,0,0.85);
      display: flex; flex-direction: column; justify-content: space-between;
      text-align: right; overflow: hidden; border: 2px solid rgba(255,255,255,0.15);
      background-size: cover; background-position: center; transition: all 0.3s ease;
    }

    /* پوسته‌های پایه (با قابلیت پشتیبانی از تصاویر اختصاصی assets) */
    .theme-gold {
      background: radial-gradient(circle at 80% 20%, #2e2308, #0a0803 80%);
      border-color: var(--gold);
    }
    .theme-birthday {
      background: linear-gradient(135deg, #421045, #14041f);
      border-color: #d946ef;
    }
    .theme-friend {
      background: linear-gradient(135deg, #0d2847, #040c17);
      border-color: #38bdf8;
    }
    .theme-luck {
      background: linear-gradient(135deg, #07381f, #02120a);
      border-color: #4ade80;
    }

    .card-top { display: flex; justify-content: space-between; align-items: center; }
    .card-logo {
      font-size: 13px; font-weight: 900; color: var(--gold); letter-spacing: 1.5px;
      text-shadow: 0 1px 3px rgba(0,0,0,0.8);
    }
    .card-badge {
      font-size: 10px; font-weight: bold; color: rgba(255,255,255,0.7);
      background: rgba(0,0,0,0.4); padding: 2px 8px; border-radius: 6px;
    }

    /* چیپ شبیه‌سازی‌شده واقعی کارت بانکی */
    .card-chip {
      width: 40px; height: 30px;
      background: linear-gradient(135deg, #d4af37, #f9e8a2 50%, #aa7c11);
      border-radius: 6px; border: 1px solid #795b00; margin: 4px 0;
      position: relative; box-shadow: inset 0 0 4px rgba(0,0,0,0.5);
    }
    .card-chip::after {
      content: ''; position: absolute; inset: 6px 10px;
      border: 1px dashed rgba(0,0,0,0.4); border-radius: 2px;
    }

    .card-msg {
      font-size: 15px; font-weight: bold; line-height: 1.5; color: #ffffff;
      text-shadow: 0 2px 4px rgba(0,0,0,0.9); margin: 6px 0; min-height: 44px;
      display: flex; align-items: center;
    }

    .card-footer {
      display: flex; justify-content: space-between; align-items: flex-end;
      font-size: 12px; border-top: 1px solid rgba(255,255,255,0.1); padding-top: 6px;
    }
    .card-holder { font-weight: bold; color: var(--gold); font-size: 13px; }

    /* تب‌های انتخاب پوسته */
    .themes-row { display: flex; gap: 6px; justify-content: center; margin-bottom: 12px; }
    .theme-btn {
      flex: 1; padding: 8px 3px; border-radius: 8px; font-size: 11px;
      font-weight: bold; border: 1px solid var(--border); background: var(--card-inner);
      color: var(--text-muted); cursor: pointer; transition: all 0.15s;
    }
    .theme-btn.active { border-color: var(--gold); color: var(--gold); background: rgba(212,175,55,0.15); }
    .theme-btn span { display: block; font-size: 9px; opacity: 0.8; margin-top: 2px; }

    /* فرم ثبت اطلاعات */
    .form-box {
      background: var(--card-bg); border: 1px solid var(--border);
      border-radius: 14px; padding: 14px; text-align: right; margin-bottom: 14px;
    }
    .input-label { font-size: 11px; color: var(--text-muted); margin-bottom: 4px; display: block; }
    .card-input {
      width: 100%; padding: 10px; background: var(--card-inner); border: 1px solid var(--border);
      border-radius: 8px; color: white; font-size: 13px; margin-bottom: 10px; outline: none;
    }
    .card-input:focus { border-color: var(--gold); }

    .btn-buy-card {
      width: 100%; background: var(--gold-gradient); color: #000;
      border: none; padding: 13px; border-radius: 10px; font-weight: bold;
      font-size: 14px; cursor: pointer; margin-bottom: 6px;
    }
    .btn-buy-card:active { transform: scale(0.98); }

    /* باکس ذخیره در گالری بعد از خرید */
    .delivery-box {
      display: none; background: rgba(52, 199, 89, 0.1); border: 1px solid var(--green);
      border-radius: 14px; padding: 16px; margin-bottom: 14px;
    }
    .btn-download {
      width: 100%; background: var(--gold-gradient); color: #000; border: none;
      padding: 13px; border-radius: 10px; font-weight: bold; font-size: 14px;
      cursor: pointer; box-shadow: 0 0 15px rgba(212,175,55,0.4);
    }
  </style>
</head>
<body>

  <!-- نوار بالای صفحه -->
  <div class="top-bar">
    <button class="btn-back" onclick="goBack()">🔙 لابی</button>
    <div style="font-weight: bold; color: var(--gold);">💳 کارت هدیه بانکی</div>
    <div style="color: var(--gold); font-weight: bold;">
      🪙 <span id="user-bal">1,000</span>
    </div>
  </div>

  <!-- انتخاب طرح کارت با قیمت اختصاصی -->
  <div class="themes-row">
    <button class="theme-btn active" onclick="setTheme('gold', 150, this)">
      🏆 VIP طلایی
      <span>۱۵۰ سکه</span>
    </button>
    <button class="theme-btn" onclick="setTheme('birthday', 130, this)">
      🎂 جشن تولد
      <span>۱۳۰ سکه</span>
    </button>
    <button class="theme-btn" onclick="setTheme('friend', 100, this)">
      🤝 رفاقتی
      <span>۱۰۰ سکه</span>
    </button>
    <button class="theme-btn" onclick="setTheme('luck', 70, this)">
      🍀 زمردی
      <span>۷۰ سکه</span>
    </button>
  </div>

  <!-- پیش‌نمایش کارت بانکی لوکس (بدون شماره کارت) -->
  <div class="card-preview-container">
    <div class="bank-card theme-gold" id="bank-card">
      <div class="card-top">
        <span class="card-logo">SIMOR GIFT CARD</span>
        <span class="card-badge" id="card-badge-txt">VIP EDITION</span>
      </div>
      <div class="card-chip"></div>
      
      <!-- پیام دلخواه تبریک -->
      <div class="card-msg" id="preview-msg">تولدت مبارک رفیق، همیشه برنده باشی! 🌸</div>

      <!-- پاورقی مشخصات فرستنده و گیرنده -->
      <div class="card-footer">
        <div>
          <span style="font-size: 9px; opacity: 0.7; display:block;">به نام:</span>
          <span class="card-holder" id="preview-to">دوست عزیز</span>
        </div>
        <div style="text-align: left;">
          <span style="font-size: 9px; opacity: 0.7; display:block;">از طرف:</span>
          <span style="color: white; font-weight: bold;" id="preview-from">علی</span>
        </div>
      </div>
    </div>
  </div>

  <!-- فرم ثبت اطلاعات -->
  <div class="form-box">
    <label class="input-label">نام دوست (دریافت‌کننده کارت):</label>
    <input type="text" class="card-input" id="input-to" value="دوست عزیز" oninput="updateCardText()">

    <label class="input-label">متن دلخواه روی کارت:</label>
    <input type="text" class="card-input" id="input-msg" value="تولدت مبارک رفیق، همیشه برنده باشی! 🌸" oninput="updateCardText()">

    <label class="input-label">نام شما (فرستنده):</label>
    <input type="text" class="card-input" id="input-from" value="علی" oninput="updateCardText()">

    <button class="btn-buy-card" id="btn-buy" onclick="purchaseCard()">💳 خرید و صدور کارت (۱۵۰ سکه)</button>
  </div>

  <!-- بخش ذخیره در گالری بعد از خرید (ارسال به پی‌وی حذف شد) -->
  <div class="delivery-box" id="delivery-box">
    <h4 style="color: var(--green); margin-bottom: 6px;">🎉 کارت هدیه با موفقیت صادر شد!</h4>
    <p style="font-size: 12px; color: var(--text-muted); margin-bottom: 14px;">
      کارت شما آماده شد. اکنون می‌توانید عکس باکیفیت آن را در گالری گوشی ذخیره کنید:
    </p>

    <button class="btn-download" onclick="downloadCardImage()">
      <span>📥 ذخیره عکس کارت در گالری گوشی (PNG)</span>
    </button>
  </div>

  <!-- کنواس مخفی با ابعاد استاندارد کارت بانکی جهت دانلود باکیفیت -->
  <canvas id="card-canvas" width="1000" height="630" style="display:none;"></canvas>

  <script>
    const tg = window.Telegram?.WebApp;
    try {
      if (tg) {
        tg.ready();
        tg.expand();
        if (tg.isVersionAtLeast && tg.isVersionAtLeast('6.1') && tg.BackButton) {
          tg.BackButton.show();
          tg.BackButton.onClick(goBack);
        }
        if (tg.initDataUnsafe?.user?.first_name) {
          document.getElementById('input-from').value = tg.initDataUnsafe.user.first_name;
          updateCardText();
        }
      }
    } catch(e) {}

    function goBack() { window.location.href = '../../index.html'; }

    let balance = 1000;
    try { balance = parseInt(localStorage.getItem('user_balance') || '1000'); } catch(e) {}
    function saveBalance() {
      try { localStorage.setItem('user_balance', balance.toString()); } catch(e) {}
      document.getElementById('user-bal').innerText = balance.toLocaleString() + ' S';
    }
    document.getElementById('user-bal').innerText = balance.toLocaleString() + ' S';

    let currentPrice = 150;
    let currentTheme = 'theme-gold';

    function setTheme(themeName, price, btn) {
      currentPrice = price;
      document.querySelectorAll('.theme-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');

      const card = document.getElementById('bank-card');
      card.className = `bank-card theme-${themeName}`;
      currentTheme = `theme-${themeName}`;

      const badges = {
        gold: 'VIP EDITION',
        birthday: 'BIRTHDAY GIFT',
        friend: 'FRIENDSHIP PASS',
        luck: 'LUCKY EDITION'
      };
      document.getElementById('card-badge-txt').innerText = badges[themeName] || 'GIFT CARD';
      document.getElementById('btn-buy').innerText = `💳 خرید و صدور کارت (${price} سکه)`;
    }

    function updateCardText() {
      document.getElementById('preview-to').innerText = document.getElementById('input-to').value || 'دوست عزیز';
      document.getElementById('preview-msg').innerText = document.getElementById('input-msg').value || 'تبریک!';
      document.getElementById('preview-from').innerText = document.getElementById('input-from').value || 'شما';
    }

    function purchaseCard() {
      if (balance < currentPrice) {
        alert(`موجودی شما کافی نیست! برای این کارت به ${currentPrice} سکه نیاز دارید.`);
        return;
      }

      balance -= currentPrice;
      saveBalance();

      try {
        if (tg?.isVersionAtLeast && tg.isVersionAtLeast('6.1') && tg?.HapticFeedback) {
          tg.HapticFeedback.notificationOccurred('success');
        }
      } catch(e) {}

      document.getElementById('btn-buy').style.display = 'none';
      document.getElementById('delivery-box').style.display = 'block';
      alert('🎉 کارت شما با موفقیت صادر شد!');
    }

    // تولید عکس تمیز در ابعاد ۱۰۰۰ در ۶۳۰ برای گالری
    function downloadCardImage() {
      const canvas = document.getElementById('card-canvas');
      const ctx = canvas.getContext('2d');

      // رنگ‌آمیزی گرادینت بدنه کارت
      if (currentTheme.includes('gold')) {
        const grad = ctx.createLinearGradient(0, 0, 1000, 630);
        grad.addColorStop(0, '#2e2308'); grad.addColorStop(1, '#0a0803');
        ctx.fillStyle = grad;
      } else if (currentTheme.includes('birthday')) {
        const grad = ctx.createLinearGradient(0, 0, 1000, 630);
        grad.addColorStop(0, '#421045'); grad.addColorStop(1, '#14041f');
        ctx.fillStyle = grad;
      } else if (currentTheme.includes('friend')) {
        const grad = ctx.createLinearGradient(0, 0, 1000, 630);
        grad.addColorStop(0, '#0d2847'); grad.addColorStop(1, '#040c17');
        ctx.fillStyle = grad;
      } else {
        const grad = ctx.createLinearGradient(0, 0, 1000, 630);
        grad.addColorStop(0, '#07381f'); grad.addColorStop(1, '#02120a');
        ctx.fillStyle = grad;
      }
      ctx.fillRect(0, 0, 1000, 630);

      // حاشیه طلایی کارت
      ctx.strokeStyle = '#e5c158';
      ctx.lineWidth = 10;
      ctx.strokeRect(15, 15, 970, 600);

      // چیپ کارت
      const chipGrad = ctx.createLinearGradient(80, 160, 200, 250);
      chipGrad.addColorStop(0, '#d4af37'); chipGrad.addColorStop(1, '#aa7c11');
      ctx.fillStyle = chipGrad;
      ctx.fillRect(80, 160, 130, 95);
      ctx.strokeStyle = '#795b00';
      ctx.lineWidth = 3;
      ctx.strokeRect(80, 160, 130, 95);

      // متون رسمی
      ctx.direction = 'rtl';
      ctx.textAlign = 'right';

      ctx.fillStyle = '#e5c158';
      ctx.font = 'bold 36px sans-serif';
      ctx.fillText('SIMOR GIFT CARD 💳', 940, 80);

      ctx.fillStyle = '#ffffff';
      ctx.font = 'bold 30px sans-serif';
      ctx.fillText(document.getElementById('preview-msg').innerText, 940, 330);

      ctx.fillStyle = '#e5c158';
      ctx.font = 'bold 26px sans-serif';
      ctx.fillText('به نام: ' + document.getElementById('preview-to').innerText, 940, 550);

      ctx.fillStyle = '#ffffff';
      ctx.font = 'bold 26px sans-serif';
      ctx.fillText('از طرف: ' + document.getElementById('preview-from').innerText, 300, 550);

      // دانلود مستقیم فایل
      const link = document.createElement('a');
      link.download = 'Simor-Gift-Card.png';
      link.href = canvas.toDataURL('image/png');
      link.click();
    }
  </script>
</body>
</html>
