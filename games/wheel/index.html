<!DOCTYPE html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>🎡 گردونهٔ سیماب | سیماب</title><script src="https://telegram.org/js/telegram-web-app.js"></script><link rel="stylesheet" href="../../assets/css/simab-common.css?v=10"><script src="../../assets/js/simab-wallet-client.js?v=11"></script></head><body><main class="shell"><header class="page-head"><h1>🎡 گردونهٔ سیماب</h1><a href="../../index.html">خانه ←</a></header><div class="balances"><div>موجودی سکه<b data-coins>—</b></div><div>ژتون<b data-chips>—</b></div></div><section class="panel" style="text-align:center"><h2>گردونهٔ رایگان روزانه</h2><div style="position:relative;width:230px;margin:25px auto"><div style="position:absolute;top:-20px;left:calc(50% - 10px);z-index:2;color:#ffe6a3">▼</div><div id="reward-wheel" style="width:230px;height:230px;border-radius:50%;border:8px solid #c19557;background:conic-gradient(#71539e 0 72deg,#258574 72deg 144deg,#bc6d48 144deg 216deg,#497c9f 216deg 288deg,#bb8d32 288deg);box-shadow:0 0 35px #9872bc35,inset 0 0 0 6px #ffffff15;display:grid;place-items:center"><span style="display:grid;place-items:center;border-radius:50%;background:#201629;border:4px solid #e0b464;width:80px;height:80px;font-size:34px">S</span></div></div><p>جایزه‌ها: ۰، ۱، ۲، ۵ یا ۱۰ سکه</p><p class="muted">هر روز UTC یک چرخش. نتیجه از سرور می‌آید؛ تغییر ساعت گوشی جایزهٔ اضافه نمی‌سازد.</p><button id="claim" disabled>در حال اتصال…</button><p id="reward-result" class="status" role="status"></p></section><p class="muted">سکه‌ها مجازی‌اند؛ برداشت نقدی وجود ندارد. موجودی در تمام بخش‌های سیماب مشترک است.</p></main><script>let busy=false;SimabWallet.subscribe(s=>{document.getElementById('claim').disabled=busy||!s.wheelAvailable;document.getElementById('claim').textContent=s.wheelAvailable?'چرخش رایگان امروز':'✓ گردونهٔ امروز انجام شد';});document.getElementById('claim').onclick=async()=>{if(busy)return;busy=true;document.getElementById('claim').disabled=true;try{const r=await SimabWallet.mutate('wallet',{walletAction:'wheel',amount:0});const prize=r.result?.wheelReward??r.rewardCoins??0;const index=[0,1,2,5,10].indexOf(prize),wheel=document.getElementById('reward-wheel');wheel.style.transition='transform 2.8s cubic-bezier(.12,.8,.2,1)';wheel.style.transform='rotate('+(1800+360-(index*72+36))+'deg)';await new Promise(r=>setTimeout(r,2850));document.getElementById('reward-result').textContent=r.duplicate||r.result?.alreadySpun?'این چرخش قبلاً ثبت شده بود.':prize.toLocaleString('fa-IR')+' سکه در کیف پول ثبت شد.';}catch(e){document.getElementById('reward-result').textContent=e.message;}finally{busy=false;document.getElementById('claim').disabled=!SimabWallet.state?.wheelAvailable;}};</script></body></html>
