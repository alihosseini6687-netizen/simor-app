<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>گردونه شانس طلایی</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg: #0c0c10;
      --card-bg: #14141b;
      --card-inner: #1a1a24;
      --gold: #e5c158;
      --gold-gradient: linear-gradient(135deg, #d4af37, #f9e8a2, #aa7c11);
      --text: #ffffff;
      --text-muted: #8e8e98;
      --border: rgba(212, 175, 55, 0.28);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; user-select: none; }
    body { background-color: var(--bg); color: var(--text); min-height: 100vh; padding: 16px; text-align: center; }

    /* نوار بالای صفحه */
    .top-bar {
      display: flex; justify-content: space-between; align-items: center;
      background: var(--card-bg); border: 1px solid var(--border);
      border-radius: 14px; padding: 10px 14px; margin-bottom: 20px;
    }
    .btn-back {
      background: #252532; color: var(--gold); border: 1px solid var(--border);
      padding: 8px 14px; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 13px;
    }
    .balance-box {
      display: flex; align-items: center; gap: 6px;
      background: rgba(212,175,55,0.12); border: 1px solid var(--border);
      padding: 6px 12px; border-radius: 20px; color: var(--gold); font-weight: bold; font-size: 14px;
    }

    /* گردونه */
    .wheel-card {
      background: var(--card-bg); border: 1px solid var(--border);
      border-radius: 18px; padding: 20px 14px; margin-bottom: 20px;
    }
    .wheel-card h2 { color: var(--gold); font-size: 20px; margin-bottom: 4px; }
    .wheel-card p { font-size: 12px; color: var(--text-muted); margin-bottom: 14px; }

    .wheel-container { position: relative; width: 270px; height: 270px; margin: 10px auto; }
    #wheel-canvas { width: 100%; height: 100%; border-radius: 50%; border: 6px solid var(--gold); box-shadow: 0 0 25px rgba(212,175,55,0.4); }
    .wheel-pointer {
      position: absolute; top: -14px; left: 50%; transform: translateX(-50%);
      width: 0; height: 0; border-left: 14px solid transparent; border-right: 14px solid transparent;
      border-top: 24px solid white; z-index: 10;
    }

    .btn-spin {
      width: 100%; max-width: 270px; margin: 18px auto 8px; display: block;
      background: var(--gold-gradient); color: #000; border: none; padding: 14px;
      border-radius: 12px; font-size: 16px; font-weight: bold; cursor: pointer;
    }
    .btn-spin:disabled { opacity: 0.5; cursor: not-allowed; }
    .timer-text { font-size: 12px; color: #ff9f0a; font-weight: 500; }

    /* جدول ۱۰ تایی تاریخچه */
    .history-card {
      background: var(--card-bg); border: 1px solid var(--border);
      border-radius: 14px; padding: 14px; text-align: right;
    }
    .history-card h4 { color: var(--gold); font-size: 13px; margin-bottom: 8px; }
    .history-table { width: 100%; border-collapse: collapse; font-size: 12px; }
    .history-table th { color: var(--text-muted); padding: 8px; border-bottom: 1px solid var(--border); text-align: center; }
    .history-table td { padding: 8px; border-bottom: 1px solid rgba(255,255,255,0.05); text-align: center; }

    /* پاپ‌آپ پیام اختصاصی */
    .modal-overlay {
      display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85);
      z-index: 1000; align-items: center; justify-content: center; padding: 16px;
    }
    .modal-overlay.open { display: flex; }
    .modal-box {
      background: var(--card-bg); border: 1px solid var(--gold);
      border-radius: 16px; width: 100%; max-width: 320px; padding: 20px; text-align: center;
    }
    .modal-icon { font-size: 40px; margin-bottom: 8px; }
    .modal-box h3 { color: var(--gold); margin-bottom: 6px; font-size: 17px; }
    .modal-box p { color: var(--text); font-size: 13px; margin-bottom: 16px; line-height: 1.6; }
    .btn-modal {
      width: 100%; background: var(--gold-gradient); color: black;
      border: none; padding: 10px; border-radius: 8px; font-weight: bold; cursor: pointer;
    }
  </style>
</head>
<body>

  <!-- نوار بالای صفحه -->
  <div class="top-bar">
    <button class="btn-back" onclick="goBack()">🔙 برگشت به منو</button>
    <div class="balance-box">
      <img src="../../assets/coin.png" width="18" height="18">
      <span id="wheel-balance">1,000</span>
    </div>
  </div>

  <!-- کارت گردونه -->
  <div class="wheel-card">
    <h2>🎡 گردونه شانس طلایی</h2>
    <p>هر ۲۴ ساعت یک شانس چرخش رایگان (ریست ساعت ۰۰:۰۰ لندن)</p>

    <div class="wheel-container">
      <div class="wheel-pointer"></div>
      <canvas id="wheel-canvas" width="270" height="270"></canvas>
    </div>

    <button id="btn-spin" class="btn-spin" onclick="spinWheel()">🎰 چرخاندن گردونه</button>
    <div class="timer-text" id="wheel-timer">آماده چرخش رایگان!</div>
  </div>

  <!-- جدول ۱۰ جایزه اخیر -->
  <div class="history-card">
    <h4>📜 تاریخچه جوایز اخیر شما (۱۰ روز گذشته)</h4>
    <table class="history-table">
      <thead>
        <tr>
          <th>تاریخ و ساعت</th>
          <th>جایزه دریافتی</th>
        </tr>
      </thead>
      <tbody id="history-body">
        <tr><td colspan="2" style="color: var(--text-muted);">هنوز چرخشی ثبت نشده است</td></tr>
      </tbody>
    </table>
  </div>

  <!-- پاپ‌آپ اختصاصی -->
  <div class="modal-overlay" id="popup-modal">
    <div class="modal-box">
      <div class="modal-icon" id="pop-icon">🎉</div>
      <h3 id="pop-title">تبریک</h3>
      <p id="pop-msg">پیام</p>
      <button class="btn-modal" onclick="closePopup()">تایید</button>
    </div>
  </div>

  <script>
    const tg = window.Telegram?.WebApp;
    try {
      if (tg) {
        tg.ready();
        tg.expand();
        if (tg.isVersionAtLeast && tg.isVersionAtLeast('6.1') && tg.BackButton) {
          tg.BackButton.show();
          tg.BackButton.onClick(goBack);
        }
      }
    } catch(e) {}

    function goBack() {
      window.location.href = '../../index.html';
    }

    let balance = 1000;
    try {
      balance = parseInt(localStorage.getItem('user_balance') || '1000');
    } catch(e) {}
    document.getElementById('wheel-balance').innerText = balance.toLocaleString() + ' S';

    function saveBalance() {
      try {
        localStorage.setItem('user_balance', balance.toString());
      } catch(e) {}
      document.getElementById('wheel-balance').innerText = balance.toLocaleString() + ' S';
    }

    function showPopup(title, msg, icon = '🎉') {
      document.getElementById('pop-icon').innerText = icon;
      document.getElementById('pop-title').innerText = title;
      document.getElementById('pop-msg').innerText = msg;
      document.getElementById('popup-modal').classList.add('open');
    }
    function closePopup() {
      document.getElementById('popup-modal').classList.remove('open');
    }

    // تنظیمات گردونه ۶ تایی با شانس وزنی دقیق
    const canvas = document.getElementById('wheel-canvas');
    const ctx = canvas.getContext('2d');
    const segments = [
      { label: '0 S', val: 0, weight: 35 },
      { label: '2 S', val: 2, weight: 30 },
      { label: '5 S', val: 5, weight: 20 },
      { label: 'چرخش مجدد', val: 'again', weight: 10 },
      { label: '15 S', val: 15, weight: 4 },
      { label: '30 S', val: 30, weight: 1 }
    ];
    const colors = ['#1a1a24', '#d4af37', '#252532', '#aa7c11', '#14141b', '#f9e8a2'];
    let currentAngle = 0;
    let spinning = false;

    function drawWheel() {
      const arc = (2 * Math.PI) / segments.length;
      ctx.clearRect(0, 0, 270, 270);
      for (let i = 0; i < segments.length; i++) {
        const angle = currentAngle + i * arc;
        ctx.beginPath();
        ctx.moveTo(135, 135);
        ctx.arc(135, 135, 130, angle, angle + arc);
        ctx.fillStyle = colors[i];
        ctx.fill();
        ctx.stroke();

        ctx.save();
        ctx.translate(135, 135);
        ctx.rotate(angle + arc / 2);
        ctx.textAlign = 'right';
        ctx.fillStyle = (colors[i] === '#f9e8a2' || colors[i] === '#d4af37') ? '#000000' : '#ffffff';
        ctx.font = 'bold 12px sans-serif';
        ctx.fillText(segments[i].label, 115, 5);
        ctx.restore();
      }
    }

    function checkDailyLimit() {
      const now = new Date();
      const todayUTC = now.getUTCFullYear() + '-' + now.getUTCMonth() + '-' + now.getUTCDate();
      try {
        if (localStorage.getItem('last_spin_day') === todayUTC) {
          document.getElementById('wheel-timer').innerText = '⏳ چرخش امروز استفاده شده (ریست ساعت ۰۰:۰۰ لندن)';
          document.getElementById('btn-spin').disabled = true;
          return false;
        }
      } catch(e) {}
      document.getElementById('wheel-timer').innerText = 'آماده چرخش رایگان!';
      document.getElementById('btn-spin').disabled = false;
      return true;
    }

    function saveHistory(rewardText) {
      try {
        let hist = JSON.parse(localStorage.getItem('wheel_history') || '[]');
        const dateStr = new Date().toLocaleDateString('fa-IR') + ' ' + new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
        hist.unshift({ date: dateStr, reward: rewardText });
        if (hist.length > 10) hist.pop(); // نگه‌داری حداکثر ۱۰ ردیف
        localStorage.setItem('wheel_history', JSON.stringify(hist));
        renderHistory();
      } catch(e) {}
    }

    function renderHistory() {
      try {
        const hist = JSON.parse(localStorage.getItem('wheel_history') || '[]');
        const tbody = document.getElementById('history-body');
        if (hist.length === 0) {
          tbody.innerHTML = '<tr><td colspan="2" style="color: var(--text-muted);">هنوز چرخشی ثبت نشده است</td></tr>';
          return;
        }
        tbody.innerHTML = hist.map(h => `
          <tr>
            <td>${h.date}</td>
            <td style="color: var(--gold); font-weight: bold;">${h.reward}</td>
          </tr>
        `).join('');
      } catch(e) {}
    }

    function spinWheel() {
      if (!checkDailyLimit() || spinning) return;
      spinning = true;

      const totalWeight = segments.reduce((sum, s) => sum + s.weight, 0);
      let rand = Math.random() * totalWeight;
      let winIndex = 0;
      for (let i = 0; i < segments.length; i++) {
        if (rand < segments[i].weight) {
          winIndex = i;
          break;
        }
        rand -= segments[i].weight;
      }

      const arc = (2 * Math.PI) / segments.length;
      const fullRotations = 5 + Math.floor(Math.random() * 3);
      const targetStopAngle = (3 * Math.PI / 2) - (winIndex * arc + arc / 2);
      const totalSpinAngle = fullRotations * 2 * Math.PI + targetStopAngle;

      let start = null;
      function anim(t) {
        if (!start) start = t;
        const p = Math.min((t - start) / 4000, 1);
        const ease = 1 - Math.pow(1 - p, 3);
        currentAngle = ease * totalSpinAngle;
        drawWheel();

        if (p < 1) {
          requestAnimationFrame(anim);
        } else {
          spinning = false;
          const prize = segments[winIndex];
          if (prize.val === 'again') {
            showPopup('چرخش مجدد', '🎉 شما برنده یک شانس چرخش مجدد شدید! می‌توانید دوباره بچرخانید.', '🎡');
            saveHistory('چرخش مجدد');
          } else {
            balance += prize.val;
            saveBalance();
            const now = new Date();
            const todayUTC = now.getUTCFullYear() + '-' + now.getUTCMonth() + '-' + now.getUTCDate();
            try { localStorage.setItem('last_spin_day', todayUTC); } catch(e) {}
            saveHistory(`+${prize.val} S`);
            checkDailyLimit();
            showPopup('تبریک!', `🎉 شما برنده ${prize.label} سکه شدید!`, '🪙');
          }
        }
      }
      requestAnimationFrame(anim);
    }

    drawWheel();
    checkDailyLimit();
    renderHistory();
  </script>
</body>
</html>
