<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>پوکر تگزاس هولدم حرفه‌ای</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg: #07170e;
      --felt: #0c381e;
      --felt-border: #4d3319;
      --gold: #e5c158;
      --gold-gradient: linear-gradient(135deg, #d4af37, #f9e8a2, #aa7c11);
      --card-bg: #14141b;
      --card-inner: #1a1a24;
      --text: #ffffff;
      --text-muted: #8e8e98;
      --red: #ff3b30;
      --green: #34c759;
      --blue: #007aff;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; user-select: none; }
    body { background-color: var(--bg); color: var(--text); min-height: 100vh; padding: 10px; overflow-x: hidden; text-align: center; }

    /* هدر */
    .top-bar {
      display: flex; justify-content: space-between; align-items: center;
      background: rgba(20,20,27,0.85); border: 1px solid rgba(212,175,55,0.3);
      border-radius: 12px; padding: 8px 12px; margin-bottom: 8px; font-size: 13px;
    }
    .btn-back {
      background: #252532; color: var(--gold); border: 1px solid rgba(212,175,55,0.3);
      padding: 6px 12px; border-radius: 8px; font-weight: bold; cursor: pointer;
    }
    .difficulty-select {
      background: #14141b; color: var(--gold); border: 1px solid var(--gold);
      padding: 4px 8px; border-radius: 6px; font-size: 11px; outline: none;
    }

    /* میز بیضی پوکر */
    .poker-table {
      position: relative; width: 100%; max-width: 380px; height: 350px;
      margin: 0 auto; background: radial-gradient(circle, #104e2a, #082815);
      border: 8px solid var(--felt-border); border-radius: 180px;
      box-shadow: inset 0 0 30px rgba(0,0,0,0.8), 0 0 20px rgba(0,0,0,0.6);
    }

    /* موقعیت صندلی‌های ۴ بازیکن */
    .player-seat {
      position: absolute; display: flex; flex-direction: column; align-items: center;
      font-size: 11px; z-index: 5;
    }
    .seat-user { bottom: 6px; left: 50%; transform: translateX(-50%); }
    .seat-bot1 { top: 50%; left: 8px; transform: translateY(-50%); }
    .seat-bot2 { top: 8px; left: 50%; transform: translateX(-50%); }
    .seat-bot3 { top: 50%; right: 8px; transform: translateY(-50%); }

    .player-tag {
      background: rgba(0,0,0,0.8); border: 1px solid var(--gold);
      border-radius: 12px; padding: 2px 8px; color: white; margin-top: 2px;
    }
    .chip-badge {
      background: rgba(212,175,55,0.25); border: 1px solid var(--gold);
      color: var(--gold); font-size: 10px; font-weight: bold;
      border-radius: 8px; padding: 1px 6px; margin-top: 2px;
    }
    .action-badge {
      font-size: 10px; font-weight: bold; padding: 1px 6px; border-radius: 4px;
      margin-top: 2px; background: rgba(0,0,0,0.7); color: var(--gold);
    }

    /* مرکز میز: پات و کارت‌های زمین */
    .table-center {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
      width: 100%; text-align: center;
    }
    .pot-box {
      display: inline-flex; align-items: center; gap: 4px;
      background: rgba(0,0,0,0.8); border: 1px solid var(--gold);
      border-radius: 14px; padding: 4px 12px; font-size: 13px; font-weight: bold;
      color: var(--gold); margin-bottom: 6px;
    }

    /* کارت‌ها */
    .cards-row { display: flex; justify-content: center; gap: 4px; }
    .card {
      width: 36px; height: 52px; background: white; border-radius: 5px;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      font-size: 13px; font-weight: bold; box-shadow: 0 2px 6px rgba(0,0,0,0.6);
      line-height: 1.1;
    }
    .card.red { color: #d00; }
    .card.black { color: #000; }
    .card-back {
      background: linear-gradient(135deg, #1e3c72, #2a5298);
      border: 1px solid #ffffff; color: transparent;
    }

    /* پنل کنترل پایین */
    .control-panel {
      margin-top: 8px; background: rgba(20,20,27,0.92);
      border: 1px solid rgba(212,175,55,0.3); border-radius: 14px;
      padding: 10px;
    }
    .game-status-text {
      font-size: 13px; color: var(--gold); margin-bottom: 8px; font-weight: bold;
    }
    .action-btn-row { display: flex; gap: 6px; justify-content: center; margin-bottom: 8px; }
    .poker-btn {
      flex: 1; padding: 10px 4px; border-radius: 8px; font-size: 12px;
      font-weight: bold; border: none; cursor: pointer; transition: transform 0.08s;
    }
    .poker-btn:active { transform: scale(0.96); }
    .poker-btn:disabled { opacity: 0.35; cursor: not-allowed; }

    .btn-fold { background: #3a1a1a; color: #ff5555; border: 1px solid #ff3b30; }
    .btn-check { background: #1a2a3a; color: #5ac8fa; border: 1px solid #007aff; }
    .btn-call { background: #1a3a22; color: #4cd964; border: 1px solid #34c759; }
    .btn-raise { background: var(--gold-gradient); color: black; }

    /* کادر تایپ دستی و کلیدهای سریع افزایش شرط */
    .raise-controls {
      display: flex; align-items: center; justify-content: center; gap: 6px;
      background: var(--card-inner); border: 1px solid var(--border);
      border-radius: 10px; padding: 6px 10px; margin-top: 6px;
    }
    .raise-input {
      width: 70px; background: #0c0c10; border: 1px solid var(--gold);
      border-radius: 6px; color: var(--gold); font-size: 13px; font-weight: bold;
      padding: 5px; text-align: center; outline: none;
    }
    .btn-chip-amt {
      background: #252532; border: 1px solid var(--border);
      color: var(--gold); padding: 5px 8px; border-radius: 6px; font-size: 11px;
      font-weight: bold; cursor: pointer;
    }
    .btn-chip-amt:active { transform: scale(0.95); }
    .btn-allin {
      background: rgba(255, 59, 48, 0.2); border: 1px solid var(--red);
      color: #ff3b30; padding: 5px 8px; border-radius: 6px; font-size: 11px;
      font-weight: bold; cursor: pointer;
    }

    /* پاپ‌آپ پایان دست */
    .modal-overlay {
      display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85);
      z-index: 1000; align-items: center; justify-content: center; padding: 16px;
    }
    .modal-overlay.open { display: flex; }
    .result-box {
      background: var(--card-bg); border: 2px solid var(--gold);
      border-radius: 16px; width: 100%; max-width: 320px; padding: 20px;
      text-align: center;
    }
  </style>
</head>
<body>

  <!-- هدر -->
  <div class="top-bar">
    <button class="btn-back" onclick="goBack()">🔙 لابی</button>
    <div>
      سطح ربات‌ها:
      <select class="difficulty-select" id="ai-difficulty" onchange="changeDifficulty(this.value)">
        <option value="easy" selected>آسان (Easy)</option>
        <option value="medium">متوسط (Medium)</option>
        <option value="hard">حرفه‌ای (Hard)</option>
      </select>
    </div>
    <div style="color: var(--gold); font-weight: bold;">
      🪙 <span id="user-bal-display">1,000</span>
    </div>
  </div>

  <!-- میز بیضی پوکر -->
  <div class="poker-table">
    
    <!-- بات ۲ (بالا) -->
    <div class="player-seat seat-bot2">
      <div class="cards-row" id="cards-bot2">
        <div class="card card-back"></div>
        <div class="card card-back"></div>
      </div>
      <div class="player-tag">🤖 آریا</div>
      <div class="chip-badge" id="chips-bot2">0 S</div>
      <div class="action-badge" id="act-bot2">-</div>
    </div>

    <!-- بات ۱ (چپ) -->
    <div class="player-seat seat-bot1">
      <div class="cards-row" id="cards-bot1">
        <div class="card card-back"></div>
        <div class="card card-back"></div>
      </div>
      <div class="player-tag">🤖 سارا</div>
      <div class="chip-badge" id="chips-bot1">0 S</div>
      <div class="action-badge" id="act-bot1">-</div>
    </div>

    <!-- مرکز میز: پات و کارت‌های مشترک -->
    <div class="table-center">
      <div class="pot-box">
        <span>🏆 پات میز:</span>
        <span id="pot-amount">۰</span> S
      </div>
      <div class="cards-row" id="community-cards">
        <div class="card card-back"></div>
        <div class="card card-back"></div>
        <div class="card card-back"></div>
        <div class="card card-back"></div>
        <div class="card card-back"></div>
      </div>
    </div>

    <!-- بات ۳ (راست) -->
    <div class="player-seat seat-bot3">
      <div class="cards-row" id="cards-bot3">
        <div class="card card-back"></div>
        <div class="card card-back"></div>
      </div>
      <div class="player-tag">🤖 مسعود</div>
      <div class="chip-badge" id="chips-bot3">0 S</div>
      <div class="action-badge" id="act-bot3">-</div>
    </div>

    <!-- بازیکن کاربر (شما - پایین میز) -->
    <div class="player-seat seat-user">
      <div class="action-badge" id="act-user">-</div>
      <div class="cards-row" id="cards-user">
        <div class="card card-back"></div>
        <div class="card card-back"></div>
      </div>
      <div class="player-tag" id="user-poker-name">👤 شما</div>
      <div class="chip-badge" id="chips-user">0 S</div>
    </div>

  </div>

  <!-- پنل کنترل پایین -->
  <div class="control-panel">
    <div class="game-status-text" id="status-text">برای شروع دست جدید روی دکمه زیر بزنید</div>
    
    <div class="action-btn-row">
      <button class="poker-btn btn-fold" id="btn-fold" onclick="userAction('fold')" disabled>انصراف (Fold)</button>
      <button class="poker-btn btn-check" id="btn-check" onclick="userAction('check')" disabled>بررسی (Check)</button>
      <button class="poker-btn btn-call" id="btn-call" onclick="userAction('call')" disabled>کال (Call)</button>
      <button class="poker-btn btn-raise" id="btn-raise" onclick="userAction('raise')" disabled>افزایش (Raise)</button>
    </div>

    <!-- کادر تایپ دستی و کلیدهای سریع افزایش شرط -->
    <div class="raise-controls">
      <span style="font-size: 11px; color: var(--text-muted);">مبلغ افزایش:</span>
      <input type="number" class="raise-input" id="custom-raise-input" value="4" min="1" oninput="onCustomRaiseInput(this.value)">
      <button class="btn-chip-amt" onclick="setRaiseAmount(5)">+۵</button>
      <button class="btn-chip-amt" onclick="setRaiseAmount(10)">+۱۰</button>
      <button class="btn-chip-amt" onclick="setRaiseAmount(25)">+۲۵</button>
      <button class="btn-allin" onclick="setAllIn()">All-in</button>
    </div>

    <button class="poker-btn btn-raise" id="btn-start" style="width: 100%; margin-top: 10px; padding: 12px; font-size: 14px;" onclick="startNewHand()">🎲 پخش کارت و شروع دست جدید</button>
  </div>

  <!-- مودال پایان دست -->
  <div class="modal-overlay" id="result-modal">
    <div class="result-box">
      <div style="font-size: 40px; margin-bottom: 6px;" id="res-icon">🏆</div>
      <h3 style="color: var(--gold); margin-bottom: 6px;" id="res-title">پایان دست</h3>
      <p style="font-size: 13px; line-height: 1.6; margin-bottom: 14px;" id="res-desc">برنده بازی مشخص شد.</p>
      <button class="poker-btn btn-raise" style="width: 100%;" onclick="closeResultModal()">دست بعدی 🎲</button>
    </div>
  </div>

  <script>
    const tg = window.Telegram?.WebApp;
    try {
      if (tg) {
        tg.ready();
        tg.expand();
        if (tg.isVersionAtLeast && tg.isVersionAtLeast('6.1') && tg.BackButton) {
          tg.BackButton.show();
          tg.BackButton.onClick(goBack);
        }
        if (tg.initDataUnsafe?.user?.first_name) {
          document.getElementById('user-poker-name').innerText = '👤 ' + tg.initDataUnsafe.user.first_name;
        }
      }
    } catch(e) {}

    function goBack() {
      window.location.href = '../../index.html';
    }

    let balance = 1000;
    try {
      balance = parseInt(localStorage.getItem('user_balance') || '1000');
    } catch(e) {}

    function saveBalance() {
      try { localStorage.setItem('user_balance', balance.toString()); } catch(e) {}
      document.getElementById('user-bal-display').innerText = balance.toLocaleString();
    }
    document.getElementById('user-bal-display').innerText = balance.toLocaleString();

    let difficulty = 'easy';
    function changeDifficulty(val) { difficulty = val; }

    const suits = ['♠', '♥', '♦', '♣'];
    const values = [
      { r: '2', v: 2 }, { r: '3', v: 3 }, { r: '4', v: 4 }, { r: '5', v: 5 },
      { r: '6', v: 6 }, { r: '7', v: 7 }, { r: '8', v: 8 }, { r: '9', v: 9 },
      { r: '10', v: 10 }, { r: 'J', v: 11 }, { r: 'Q', v: 12 }, { r: 'K', v: 13 }, { r: 'A', v: 14 }
    ];

    let deck = [];
    let pot = 0;
    let stage = 0; // 0: Preflop, 1: Flop, 2: Turn, 3: River, 4: Showdown
    let currentHighestBet = 2;
    let selectedRaiseAmt = 4;

    let cCard1 = null, cCard2 = null, cCard3 = null, cCard4 = null, cCard5 = null;

    let pUser = { id: 'user', name: 'شما', bet: 0, folded: false, card1: null, card2: null };
    let pBot1 = { id: 'bot1', name: 'سارا', bet: 0, folded: false, card1: null, card2: null };
    let pBot2 = { id: 'bot2', name: 'آریا', bet: 0, folded: false, card1: null, card2: null };
    let pBot3 = { id: 'bot3', name: 'مسعود', bet: 0, folded: false, card1: null, card2: null };

    function buildDeck() {
      deck = [];
      for (let s of suits) {
        for (let v of values) {
          deck.push({ rank: v.r, val: v.v, suit: s, color: (s === '♥' || s === '♦') ? 'red' : 'black' });
        }
      }
      for (let i = deck.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        const temp = deck[i];
        deck[i] = deck[j];
        deck[j] = temp;
      }
    }

    function renderCard(card, faceDown = false) {
      if (faceDown || !card) return '<div class="card card-back"></div>';
      return `<div class="card ${card.color}">${card.rank}<br><span style="font-size:11px;">${card.suit}</span></div>`;
    }

    // کنترل ورودی تایپ دستی شرط
    function onCustomRaiseInput(val) {
      let amt = parseInt(val) || 1;
      if (amt > balance) amt = Math.max(1, balance);
      if (amt < 1) amt = 1;
      selectedRaiseAmt = amt;
      document.getElementById('btn-raise').innerText = `افزایش (+${selectedRaiseAmt} S)`;
    }

    function setRaiseAmount(amt) {
      let finalAmt = Math.min(amt, Math.max(1, balance));
      selectedRaiseAmt = finalAmt;
      const inp = document.getElementById('custom-raise-input');
      if (inp) inp.value = finalAmt;
      document.getElementById('btn-raise').innerText = `افزایش (+${finalAmt} S)`;
    }

    function setAllIn() {
      selectedRaiseAmt = Math.max(1, balance);
      const inp = document.getElementById('custom-raise-input');
      if (inp) inp.value = selectedRaiseAmt;
      document.getElementById('btn-raise').innerText = `افزایش (All-in ${selectedRaiseAmt} S)`;
    }

    function setButtonsState() {
      const toCall = currentHighestBet - pUser.bet;
      document.getElementById('btn-fold').disabled = false;

      if (toCall <= 0) {
        document.getElementById('btn-check').disabled = false;
        document.getElementById('btn-call').disabled = true;
        document.getElementById('btn-call').innerText = 'کال (Call)';
      } else {
        document.getElementById('btn-check').disabled = true;
        document.getElementById('btn-call').disabled = false;
        document.getElementById('btn-call').innerText = `کال (${toCall} S)`;
      }

      document.getElementById('btn-raise').disabled = false;
      document.getElementById('btn-raise').innerText = `افزایش (+${selectedRaiseAmt} S)`;
    }

    function disableAllButtons() {
      document.getElementById('btn-fold').disabled = true;
      document.getElementById('btn-check').disabled = true;
      document.getElementById('btn-call').disabled = true;
      document.getElementById('btn-raise').disabled = true;
    }

    function updateTableUI() {
      document.getElementById('pot-amount').innerText = pot;
      document.getElementById('chips-user').innerText = `${pUser.bet} S`;
      document.getElementById('chips-bot1').innerText = `${pBot1.bet} S`;
      document.getElementById('chips-bot2').innerText = `${pBot2.bet} S`;
      document.getElementById('chips-bot3').innerText = `${pBot3.bet} S`;

      if (pUser.card1 && pUser.card2) {
        document.getElementById('cards-user').innerHTML = renderCard(pUser.card1) + renderCard(pUser.card2);
      }

      const showBots = (stage === 4);
      if (pBot1.card1 && pBot1.card2) {
        document.getElementById('cards-bot1').innerHTML = renderCard(pBot1.card1, !showBots) + renderCard(pBot1.card2, !showBots);
      }
      if (pBot2.card1 && pBot2.card2) {
        document.getElementById('cards-bot2').innerHTML = renderCard(pBot2.card1, !showBots) + renderCard(pBot2.card2, !showBots);
      }
      if (pBot3.card1 && pBot3.card2) {
        document.getElementById('cards-bot3').innerHTML = renderCard(pBot3.card1, !showBots) + renderCard(pBot3.card2, !showBots);
      }

      let commHtml = '';
      commHtml += (stage >= 1) ? renderCard(cCard1) : renderCard(null, true);
      commHtml += (stage >= 1) ? renderCard(cCard2) : renderCard(null, true);
      commHtml += (stage >= 1) ? renderCard(cCard3) : renderCard(null, true);
      commHtml += (stage >= 2) ? renderCard(cCard4) : renderCard(null, true);
      commHtml += (stage >= 3) ? renderCard(cCard5) : renderCard(null, true);
      document.getElementById('community-cards').innerHTML = commHtml;
    }

    function startNewHand() {
      if (balance < 2) {
        alert('موجودی سکه برای ورود به دست کافی نیست!');
        return;
      }

      buildDeck();
      stage = 0;
      currentHighestBet = 2;

      pUser = { id: 'user', name: 'شما', bet: 2, folded: false, card1: deck.pop(), card2: deck.pop() };
      pBot1 = { id: 'bot1', name: 'سارا', bet: 1, folded: false, card1: deck.pop(), card2: deck.pop() };
      pBot2 = { id: 'bot2', name: 'آریا', bet: 2, folded: false, card1: deck.pop(), card2: deck.pop() };
      pBot3 = { id: 'bot3', name: 'مسعود', bet: 2, folded: false, card1: deck.pop(), card2: deck.pop() };

      cCard1 = deck.pop(); cCard2 = deck.pop(); cCard3 = deck.pop();
      cCard4 = deck.pop(); cCard5 = deck.pop();

      balance -= 2;
      pot = 7;
      saveBalance();

      document.getElementById('act-user').innerText = 'شرط: ۲S';
      document.getElementById('act-bot1').innerText = 'اسمال: ۱S';
      document.getElementById('act-bot2').innerText = 'بیگ: ۲S';
      document.getElementById('act-bot3').innerText = 'کال: ۲S';

      updateTableUI();
      document.getElementById('btn-start').style.display = 'none';
      setButtonsState();
      document.getElementById('status-text').innerText = 'مرحله Pre-Flop: نوبت شماست';
    }

    function userAction(action) {
      disableAllButtons();

      if (action === 'fold') {
        pUser.folded = true;
        document.getElementById('act-user').innerText = 'فولد ✕';
        document.getElementById('act-user').style.color = '#ff3b30';
        endHand('شما از این دست انصراف دادید.', false);
        return;
      } else if (action === 'check') {
        document.getElementById('act-user').innerText = 'چک ✓';
        document.getElementById('act-user').style.color = '#5ac8fa';
      } else if (action === 'call') {
        const toCall = currentHighestBet - pUser.bet;
        balance -= toCall;
        pot += toCall;
        pUser.bet += toCall;
        saveBalance();
        document.getElementById('act-user').innerText = `کال (${toCall}S)`;
        document.getElementById('act-user').style.color = '#34c759';
      } else if (action === 'raise') {
        const toCall = currentHighestBet - pUser.bet;
        let actualRaise = selectedRaiseAmt;
        if (balance < toCall + actualRaise) actualRaise = Math.max(1, balance - toCall);

        const totalCost = toCall + actualRaise;
        balance -= totalCost;
        pot += totalCost;
        pUser.bet += totalCost;
        currentHighestBet = pUser.bet;
        saveBalance();
        document.getElementById('act-user').innerText = `افزایش (+${actualRaise}S)`;
        document.getElementById('act-user').style.color = '#ffd700';
      }

      updateTableUI();
      document.getElementById('status-text').innerText = 'ربات‌ها در حال تفکر...';
      setTimeout(botTurns, 650);
    }

    function botTurns() {
      const bots = [pBot1, pBot2, pBot3];

      bots.forEach(bot => {
        if (bot.folded) return;

        let act = 'check';
        const rand = Math.random();

        if (difficulty === 'easy') {
          if (rand < 0.22) act = 'fold';
          else if (rand < 0.8) act = 'call';
          else act = 'check';
        } else if (difficulty === 'medium') {
          if (rand < 0.12) act = 'fold';
          else if (rand < 0.7) act = 'call';
          else act = 'raise';
        } else {
          if (rand < 0.05) act = 'fold';
          else if (rand < 0.5) act = 'call';
          else act = 'raise';
        }

        const actEl = document.getElementById(`act-${bot.id}`);
        if (act === 'fold') {
          bot.folded = true;
          actEl.innerText = 'فولد';
          actEl.style.color = '#ff3b30';
        } else if (act === 'call') {
          const toCall = Math.max(0, currentHighestBet - bot.bet);
          pot += toCall;
          bot.bet += toCall;
          actEl.innerText = 'کال';
          actEl.style.color = '#34c759';
        } else if (act === 'raise') {
          const raiseAmt = (difficulty === 'hard') ? 5 : 2;
          const toCall = Math.max(0, currentHighestBet - bot.bet);
          pot += (toCall + raiseAmt);
          bot.bet += (toCall + raiseAmt);
          currentHighestBet = bot.bet;
          actEl.innerText = 'افزایش';
          actEl.style.color = '#ffd700';
        } else {
          actEl.innerText = 'چک';
          actEl.style.color = '#5ac8fa';
        }
      });

      stage++;
      updateTableUI();

      if (stage === 1) {
        document.getElementById('status-text').innerText = 'مرحله Flop (۳ کارت زمین رو شد)';
        setButtonsState();
      } else if (stage === 2) {
        document.getElementById('status-text').innerText = 'مرحله Turn (کارت چهارم رو شد)';
        setButtonsState();
      } else if (stage === 3) {
        document.getElementById('status-text').innerText = 'مرحله River (کارت پنجم رو شد)';
        setButtonsState();
      } else {
        stage = 4;
        updateTableUI();
        evaluateWinner();
      }
    }

    function eval5(c) {
      const vals = c.map(x => x.val).sort((a,b) => b-a);
      const suitsMap = c.map(x => x.suit);
      const isFlush = suitsMap.every(s => s === suitsMap[0]);

      const counts = {};
      vals.forEach(v => counts[v] = (counts[v] || 0) + 1);
      const pairs = Object.entries(counts).map(([v, count]) => ({ val: parseInt(v), count })).sort((a,b) => b.count - a.count || b.val - a.val);

      const uniqueVals = [...new Set(vals)];
      let isStraight = false;
      if (uniqueVals.length === 5) {
        if (uniqueVals[0] - uniqueVals === 4) isStraight = true;
        if (uniqueVals[0] === 14 && uniqueVals === 5 && uniqueVals === 2) isStraight = true;
      }

      if (isFlush && isStraight) return { score: 9, name: 'استریت فلاش (Straight Flush)' };
      if (pairs[0].count === 4) return { score: 7, name: 'کاره (Four of a Kind)' };
      if (pairs[0].count === 3 && pairs?.count === 2) return { score: 6, name: 'فول هاوس (Full House)' };
      if (isFlush) return { score: 5, name: 'رنگ (Flush)' };
      if (isStraight) return { score: 4, name: 'ردیف (Straight)' };
      if (pairs[0].count === 3) return { score: 3, name: 'سه تایی (Three of a Kind)' };
      if (pairs[0].count === 2 && pairs?.count === 2) return { score: 2, name: 'دو جفت (Two Pair)' };
      if (pairs[0].count === 2) return { score: 1, name: 'یک جفت (One Pair)' };
      return { score: 0, name: 'کارت بالا (High Card)' };
    }

    function evaluateWinner() {
      if (pUser.folded) {
        endHand('شما فولد کرده بودید.', false);
        return;
      }

      const u7 = [pUser.card1, pUser.card2, cCard1, cCard2, cCard3, cCard4, cCard5];
      let bestUser = { score: -1, name: '' };

      for (let i = 0; i < 7; i++) {
        for (let j = i + 1; j < 7; j++) {
          const combo = u7.filter((_, idx) => idx !== i && idx !== j);
          const res = eval5(combo);
          if (res.score > bestUser.score) bestUser = res;
        }
      }

      let botMaxScore = 0;
      if (difficulty === 'easy') botMaxScore = Math.floor(Math.random() * 2);
      else if (difficulty === 'medium') botMaxScore = Math.floor(Math.random() * 3);
      else botMaxScore = Math.floor(Math.random() * 5);

      if (bestUser.score >= botMaxScore) {
        balance += pot;
        saveBalance();
        endHand(`🎉 تبریک! شما با دست ${bestUser.name} کل پات به ارزش ${pot} سکه S را بردید!`, true);
      } else {
        const winner = [pBot1, pBot2, pBot3].find(b => !b.folded) || pBot2;
        endHand(`🤖 ${winner.name} با دست برتر برنده پات ${pot} سکه شد. دست شما: ${bestUser.name}`, false);
      }
    }

    function endHand(msg, won) {
      document.getElementById('res-icon').innerText = won ? '🏆' : '🃏';
      document.getElementById('res-title').innerText = won ? 'پیروزی شما!' : 'پایان دست';
      document.getElementById('res-desc').innerText = msg;
      document.getElementById('result-modal').classList.add('open');
      document.getElementById('btn-start').style.display = 'block';
      disableAllButtons();
    }

    function closeResultModal() {
      document.getElementById('result-modal').classList.remove('open');
      document.getElementById('status-text').innerText = 'برای شروع دست بعدی روی دکمه زیر بزنید';
    }
  </script>
