<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>میز پوکر تگزاس هولدم</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg: #07170e;
      --felt: #0c381e;
      --felt-border: #4d3319;
      --gold: #e5c158;
      --gold-gradient: linear-gradient(135deg, #d4af37, #f9e8a2, #aa7c11);
      --card-bg: #14141b;
      --text: #ffffff;
      --text-muted: #8e8e98;
      --red: #ff3b30;
      --green: #34c759;
      --blue: #007aff;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; user-select: none; }
    body { background-color: var(--bg); color: var(--text); min-height: 100vh; padding: 10px; overflow-x: hidden; text-align: center; }

    /* هدر */
    .top-bar {
      display: flex; justify-content: space-between; align-items: center;
      background: rgba(20,20,27,0.85); border: 1px solid rgba(212,175,55,0.3);
      border-radius: 12px; padding: 8px 12px; margin-bottom: 8px; font-size: 13px;
    }
    .btn-back {
      background: #252532; color: var(--gold); border: 1px solid rgba(212,175,55,0.3);
      padding: 6px 12px; border-radius: 8px; font-weight: bold; cursor: pointer;
    }
    .difficulty-select {
      background: #14141b; color: var(--gold); border: 1px solid var(--gold);
      padding: 4px 8px; border-radius: 6px; font-size: 11px; outline: none;
    }

    /* میز بیضی پوکر */
    .poker-table {
      position: relative; width: 100%; max-width: 380px; height: 350px;
      margin: 0 auto; background: radial-gradient(circle, #104e2a, #082815);
      border: 8px solid var(--felt-border); border-radius: 180px;
      box-shadow: inset 0 0 30px rgba(0,0,0,0.8), 0 0 20px rgba(0,0,0,0.6);
    }

    /* موقعیت صندلی‌های ۴ بازیکن */
    .player-seat {
      position: absolute; display: flex; flex-direction: column; align-items: center;
      font-size: 11px; z-index: 5;
    }
    .seat-user { bottom: 8px; left: 50%; transform: translateX(-50%); }
    .seat-bot1 { top: 50%; left: 8px; transform: translateY(-50%); }
    .seat-bot2 { top: 8px; left: 50%; transform: translateX(-50%); }
    .seat-bot3 { top: 50%; right: 8px; transform: translateY(-50%); }

    .player-tag {
      background: rgba(0,0,0,0.75); border: 1px solid var(--gold);
      border-radius: 12px; padding: 2px 8px; color: white; margin-top: 2px;
    }
    .chip-badge {
      background: rgba(212,175,55,0.2); border: 1px solid var(--gold);
      color: var(--gold); font-size: 10px; font-weight: bold;
      border-radius: 8px; padding: 1px 6px; margin-top: 2px;
    }
    .action-badge {
      font-size: 10px; font-weight: bold; padding: 1px 6px; border-radius: 4px;
      margin-top: 2px; background: rgba(0,0,0,0.6); color: var(--gold);
    }

    /* مرکز میز: پات و کارت‌های زمین */
    .table-center {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
      width: 100%; text-align: center;
    }
    .pot-box {
      display: inline-flex; align-items: center; gap: 4px;
      background: rgba(0,0,0,0.7); border: 1px solid var(--gold);
      border-radius: 14px; padding: 4px 12px; font-size: 13px; font-weight: bold;
      color: var(--gold); margin-bottom: 6px;
    }

    /* کارت‌ها */
    .cards-row { display: flex; justify-content: center; gap: 4px; }
    .card {
      width: 34px; height: 50px; background: white; border-radius: 4px;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      font-size: 13px; font-weight: bold; box-shadow: 0 2px 5px rgba(0,0,0,0.5);
      line-height: 1;
    }
    .card.red { color: #d00; }
    .card.black { color: #000; }
    .card-back {
      background: linear-gradient(135deg, #1e3c72, #2a5298);
      border: 1px solid white; color: transparent;
    }

    /* پنل دکمه‌های کنترل بازی در پایین */
    .control-panel {
      margin-top: 10px; background: rgba(20,20,27,0.9);
      border: 1px solid rgba(212,175,55,0.3); border-radius: 14px;
      padding: 10px;
    }
    .game-status-text {
      font-size: 13px; color: var(--gold); margin-bottom: 8px; font-weight: bold;
    }
    .action-btn-row { display: flex; gap: 6px; justify-content: center; }
    .poker-btn {
      flex: 1; padding: 10px 4px; border-radius: 8px; font-size: 12px;
      font-weight: bold; border: none; cursor: pointer; transition: transform 0.08s;
    }
    .poker-btn:active { transform: scale(0.96); }
    .poker-btn:disabled { opacity: 0.35; cursor: not-allowed; }

    .btn-fold { background: #3a1a1a; color: #ff5555; border: 1px solid #ff3b30; }
    .btn-check { background: #1a2a3a; color: #5ac8fa; border: 1px solid #007aff; }
    .btn-call { background: #1a3a22; color: #4cd964; border: 1px solid #34c759; }
    .btn-raise { background: var(--gold-gradient); color: black; }

    /* پاپ‌آپ پایان دست */
    .modal-overlay {
      display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85);
      z-index: 1000; align-items: center; justify-content: center; padding: 16px;
    }
    .modal-overlay.open { display: flex; }
    .result-box {
      background: var(--card-bg); border: 2px solid var(--gold);
      border-radius: 16px; width: 100%; max-width: 320px; padding: 20px;
      text-align: center;
    }
  </style>
</head>
<body>

  <!-- هدر -->
  <div class="top-bar">
    <button class="btn-back" onclick="goBack()">🔙 لابی</button>
    <div>
      سطح ربات‌ها:
      <select class="difficulty-select" id="ai-difficulty" onchange="changeDifficulty(this.value)">
        <option value="easy" selected>آسان (Easy)</option>
        <option value="medium">متوسط (Medium)</option>
        <option value="hard">حرفه‌ای (Hard)</option>
      </select>
    </div>
    <div style="color: var(--gold); font-weight: bold;">
      🪙 <span id="user-bal-display">1,000</span>
    </div>
  </div>

  <!-- میز بیضی پوکر -->
  <div class="poker-table">
    
    <!-- بات ۲ (بالا) -->
    <div class="player-seat seat-bot2">
      <div class="cards-row" id="cards-bot2">
        <div class="card card-back"></div>
        <div class="card card-back"></div>
      </div>
      <div class="player-tag">🤖 آریا</div>
      <div class="chip-badge" id="chips-bot2">0 S</div>
      <div class="action-badge" id="act-bot2">-</div>
    </div>

    <!-- بات ۱ (چپ) -->
    <div class="player-seat seat-bot1">
      <div class="cards-row" id="cards-bot1">
        <div class="card card-back"></div>
        <div class="card card-back"></div>
      </div>
      <div class="player-tag">🤖 سارا</div>
      <div class="chip-badge" id="chips-bot1">0 S</div>
      <div class="action-badge" id="act-bot1">-</div>
    </div>

    <!-- مرکز میز: پات و کارت‌های مشترک -->
    <div class="table-center">
      <div class="pot-box">
        <span>🏆 پات میز:</span>
        <span id="pot-amount">۰</span> S
      </div>
      <div class="cards-row" id="community-cards">
        <div class="card card-back"></div>
        <div class="card card-back"></div>
        <div class="card card-back"></div>
        <div class="card card-back"></div>
        <div class="card card-back"></div>
      </div>
    </div>

    <!-- بات ۳ (راست) -->
    <div class="player-seat seat-bot3">
      <div class="cards-row" id="cards-bot3">
        <div class="card card-back"></div>
        <div class="card card-back"></div>
      </div>
      <div class="player-tag">🤖 مسعود</div>
      <div class="chip-badge" id="chips-bot3">0 S</div>
      <div class="action-badge" id="act-bot3">-</div>
    </div>

    <!-- بازیکن کاربر (شما - پایین میز) -->
    <div class="player-seat seat-user">
      <div class="action-badge" id="act-user">-</div>
      <div class="cards-row" id="cards-user">
        <div class="card card-back"></div>
        <div class="card card-back"></div>
      </div>
      <div class="player-tag" id="user-poker-name">👤 شما</div>
      <div class="chip-badge" id="chips-user">0 S</div>
    </div>

  </div>

  <!-- پنل کنترل پایین -->
  <div class="control-panel">
    <div class="game-status-text" id="status-text">برای شروع دست جدید روی دکمه زیر بزنید</div>
    <div class="action-btn-row">
      <button class="poker-btn btn-fold" id="btn-fold" onclick="userAction('fold')" disabled>انصراف (Fold)</button>
      <button class="poker-btn btn-check" id="btn-check" onclick="userAction('check')" disabled>بررسی (Check)</button>
      <button class="poker-btn btn-call" id="btn-call" onclick="userAction('call')" disabled>کال (Call 2 S)</button>
      <button class="poker-btn btn-raise" id="btn-raise" onclick="userAction('raise')" disabled>افزایش (+4 S)</button>
    </div>
    <button class="poker-btn btn-raise" id="btn-start" style="width: 100%; margin-top: 8px; padding: 12px;" onclick="startNewHand()">🎲 پخش کارت و شروع دست جدید</button>
  </div>

  <!-- مودال پایان دست -->
  <div class="modal-overlay" id="result-modal">
    <div class="result-box">
      <div style="font-size: 40px; margin-bottom: 6px;" id="res-icon">🏆</div>
      <h3 style="color: var(--gold); margin-bottom: 6px;" id="res-title">پایان دست</h3>
      <p style="font-size: 13px; line-height: 1.6; margin-bottom: 14px;" id="res-desc">برنده بازی مشخص شد.</p>
      <button class="poker-btn btn-raise" style="width: 100%;" onclick="closeResultModal()">دست بعدی 🎲</button>
    </div>
  </div>

  <script>
    const tg = window.Telegram?.WebApp;
    try {
      if (tg) {
        tg.ready();
        tg.expand();
        if (tg.isVersionAtLeast && tg.isVersionAtLeast('6.1') && tg.BackButton) {
          tg.BackButton.show();
          tg.BackButton.onClick(goBack);
        }
        if (tg.initDataUnsafe?.user?.first_name) {
          document.getElementById('user-poker-name').innerText = '👤 ' + tg.initDataUnsafe.user.first_name;
        }
      }
    } catch(e) {}

    function goBack() {
      window.location.href = '../../index.html';
    }

    let balance = 1000;
    try {
      balance = parseInt(localStorage.getItem('user_balance') || '1000');
    } catch(e) {}

    function saveBalance() {
      try { localStorage.setItem('user_balance', balance.toString()); } catch(e) {}
      document.getElementById('user-bal-display').innerText = balance.toLocaleString();
    }
    document.getElementById('user-bal-display').innerText = balance.toLocaleString();

    let difficulty = 'easy';
    function changeDifficulty(val) { difficulty = val; }

    const suits = ['♠', '♥', '♦', '♣'];
    const values = [
      { r: '2', v: 2 }, { r: '3', v: 3 }, { r: '4', v: 4 }, { r: '5', v: 5 },
      { r: '6', v: 6 }, { r: '7', v: 7 }, { r: '8', v: 8 }, { r: '9', v: 9 },
      { r: '10', v: 10 }, { r: 'J', v: 11 }, { r: 'Q', v: 12 }, { r: 'K', v: 13 }, { r: 'A', v: 14 }
    ];

    let deck = [];
    let pot = 0;
    let stage = 0; // 0: Preflop, 1: Flop, 2: Turn, 3: River, 4: Showdown
    let communityCards = [];

    // بازیکنان
    let playerUser = { id: 'user', name: 'شما', bet: 0, folded: false, cards: [] };
    let playerBot1 = { id: 'bot1', name: 'سارا', bet: 0, folded: false, cards: [] };
    let playerBot2 = { id: 'bot2', name: 'آریا', bet: 0, folded: false, cards: [] };
    let playerBot3 = { id: 'bot3', name: 'مسعود', bet: 0, folded: false, cards: [] };

    function buildDeck() {
      deck = [];
      for (let s of suits) {
        for (let v of values) {
          deck.push({ rank: v.r, val: v.v, suit: s, color: (s === '♥' || s === '♦') ? 'red' : 'black' });
        }
      }
      for (let i = deck.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        const temp = deck[i];
        deck[i] = deck[j];
        deck[j] = temp;
      }
    }

    function renderCard(card, faceDown = false) {
      if (faceDown || !card) return '<div class="card card-back"></div>';
      return `<div class="card ${card.color}">${card.rank}<br><span style="font-size:11px;">${card.suit}</span></div>`;
    }

    function setButtonsEnabled(enabled) {
      document.getElementById('btn-fold').disabled = !enabled;
      document.getElementById('btn-check').disabled = !enabled;
      document.getElementById('btn-call').disabled = !enabled;
      document.getElementById('btn-raise').disabled = !enabled;
    }

    function updateTableUI() {
      document.getElementById('pot-amount').innerText = pot;
      document.getElementById('chips-user').innerText = `${playerUser.bet} S`;
      document.getElementById('chips-bot1').innerText = `${playerBot1.bet} S`;
      document.getElementById('chips-bot2').innerText = `${playerBot2.bet} S`;
      document.getElementById('chips-bot3').innerText = `${playerBot3.bet} S`;

      // کارت‌های بازیکن
      if (playerUser.cards.length >= 2) {
        document.getElementById('cards-user').innerHTML = 
          renderCard(playerUser.cards[0]) + renderCard(playerUser.cards);
      }

      // کارت‌های ربات‌ها
      const showBots = (stage === 4);
      if (playerBot1.cards.length >= 2) {
        document.getElementById('cards-bot1').innerHTML = 
          renderCard(playerBot1.cards[0], !showBots) + renderCard(playerBot1.cards, !showBots);
      }
      if (playerBot2.cards.length >= 2) {
        document.getElementById('cards-bot2').innerHTML = 
          renderCard(playerBot2.cards[0], !showBots) + renderCard(playerBot2.cards, !showBots);
      }
      if (playerBot3.cards.length >= 2) {
        document.getElementById('cards-bot3').innerHTML = 
          renderCard(playerBot3.cards[0], !showBots) + renderCard(playerBot3.cards, !showBots);
      }

      // کارت‌های زمین
      let commHtml = '';
      for (let i = 0; i < 5; i++) {
        if (stage === 0) commHtml += renderCard(null, true);
        else if (stage === 1 && i < 3) commHtml += renderCard(communityCards[i]);
        else if (stage === 2 && i < 4) commHtml += renderCard(communityCards[i]);
        else if (stage >= 3) commHtml += renderCard(communityCards[i]);
        else commHtml += renderCard(null, true);
      }
      document.getElementById('community-cards').innerHTML = commHtml;
    }

    // شروع دست
    function startNewHand() {
      if (balance < 2) {
        alert('موجودی سکه برای ورود به دست کافی نیست!');
        return;
      }

      buildDeck();
      stage = 0;

      // ریست وضعیت بازیکنان
      playerUser = { id: 'user', name: 'شما', bet: 2, folded: false, cards: [deck.pop(), deck.pop()] };
      playerBot1 = { id: 'bot1', name: 'سارا', bet: 1, folded: false, cards: [deck.pop(), deck.pop()] };
      playerBot2 = { id: 'bot2', name: 'آریا', bet: 2, folded: false, cards: [deck.pop(), deck.pop()] };
      playerBot3 = { id: 'bot3', name: 'مسعود', bet: 2, folded: false, cards: [deck.pop(), deck.pop()] };

      communityCards = [deck.pop(), deck.pop(), deck.pop(), deck.pop(), deck.pop()];

      balance -= 2;
      pot = 7; // بلایندها
      saveBalance();

      // ریست نشان‌ها
      document.getElementById('act-user').innerText = '-';
      document.getElementById('act-bot1').innerText = '-';
      document.getElementById('act-bot2').innerText = '-';
      document.getElementById('act-bot3').innerText = '-';

      updateTableUI();
      document.getElementById('btn-start').style.display = 'none';
      setButtonsEnabled(true);
      document.getElementById('status-text').innerText = 'نوبت شما: حرکت مورد نظر را انتخاب کنید';
    }

    // اقدامات کاربر
    function userAction(action) {
      setButtonsEnabled(false);

      if (action === 'fold') {
        playerUser.folded = true;
        document.getElementById('act-user').innerText = 'فولد';
        document.getElementById('act-user').style.color = '#ff3b30';
        endHand('شما از این دست انصراف دادید.', false);
        return;
      } else if (action === 'check') {
        document.getElementById('act-user').innerText = 'چک';
        document.getElementById('act-user').style.color = '#5ac8fa';
      } else if (action === 'call') {
        balance -= 2;
        pot += 2;
        playerUser.bet += 2;
        saveBalance();
        document.getElementById('act-user').innerText = 'کال (2S)';
        document.getElementById('act-user').style.color = '#34c759';
      } else if (action === 'raise') {
        balance -= 4;
        pot += 4;
        playerUser.bet += 4;
        saveBalance();
        document.getElementById('act-user').innerText = 'افزایش (4S)';
        document.getElementById('act-user').style.color = '#ffd700';
      }

      updateTableUI();
      document.getElementById('status-text').innerText = 'ربات‌ها در حال تصمیم‌گیری...';
      setTimeout(botTurns, 700);
    }

    // نوبت هوش مصنوعی
    function botTurns() {
      const bots = [playerBot1, playerBot2, playerBot3];

      bots.forEach(bot => {
        if (bot.folded) return;

        let act = 'check';
        const rand = Math.random();

        if (difficulty === 'easy') {
          if (rand < 0.2) act = 'fold';
          else if (rand < 0.8) act = 'call';
          else act = 'check';
        } else if (difficulty === 'medium') {
          if (rand < 0.12) act = 'fold';
          else if (rand < 0.65) act = 'call';
          else act = 'raise';
        } else {
          if (rand < 0.05) act = 'fold';
          else if (rand < 0.5) act = 'call';
          else act = 'raise';
        }

        const actEl = document.getElementById(`act-${bot.id}`);
        if (act === 'fold') {
          bot.folded = true;
          actEl.innerText = 'فولد';
          actEl.style.color = '#ff3b30';
        } else if (act === 'call') {
          pot += 2;
          bot.bet += 2;
          actEl.innerText = 'کال';
          actEl.style.color = '#34c759';
        } else if (act === 'raise') {
          pot += 4;
          bot.bet += 4;
          actEl.innerText = 'افزایش';
          actEl.style.color = '#ffd700';
        } else {
          actEl.innerText = 'چک';
          actEl.style.color = '#5ac8fa';
        }
      });

      stage++;
      updateTableUI();

      if (stage === 1) {
        document.getElementById('status-text').innerText = 'مرحله Flop (۳ کارت زمین رو شد)';
        setButtonsEnabled(true);
      } else if (stage === 2) {
        document.getElementById('status-text').innerText = 'مرحله Turn (کارت چهارم رو شد)';
        setButtonsEnabled(true);
      } else if (stage === 3) {
        document.getElementById('status-text').innerText = 'مرحله River (کارت پنجم رو شد)';
        setButtonsEnabled(true);
      } else {
        stage = 4;
        updateTableUI();
        evaluateWinner();
      }
    }

    function evaluateWinner() {
      if (playerUser.folded) {
        endHand('شما فولد کرده بودید.', false);
        return;
      }

      // مقایسه هوشمند ارزش دست کاربر
      const uCard1 = playerUser.cards[0].val;
      const uCard2 = playerUser.cards.val;
      const isPair = (uCard1 === uCard2) || communityCards.some(c => c.val === uCard1 || c.val === uCard2);

      let userWon = false;
      if (difficulty === 'easy') {
        userWon = isPair || Math.random() > 0.35;
      } else if (difficulty === 'medium') {
        userWon = isPair && Math.random() > 0.4;
      } else {
        userWon = isPair && Math.random() > 0.6;
      }

      if (userWon) {
        balance += pot;
        saveBalance();
        endHand(`🎉 تبریک! شما با دست برتر کل پات به ارزش ${pot} سکه را بردید!`, true);
      } else {
        const winningBot = [playerBot1, playerBot2, playerBot3].find(b => !b.folded) || playerBot2;
        endHand(`🤖 ${winningBot.name} با دست قوی‌تر برنده پات ${pot} سکه شد.`, false);
      }
    }

    function endHand(msg, won) {
      document.getElementById('res-icon').innerText = won ? '🏆' : '🃏';
      document.getElementById('res-title').innerText = won ? 'پیروزی شما!' : 'پایان دست';
      document.getElementById('res-desc').innerText = msg;
      document.getElementById('result-modal').classList.add('open');
      document.getElementById('btn-start').style.display = 'block';
      setButtonsEnabled(false);
    }

    function closeResultModal() {
      document.getElementById('result-modal').classList.remove('open');
      document.getElementById('status-text').innerText = 'برای شروع دست بعدی روی دکمه زیر بزنید';
    }
  </script>
</body>
</html>
