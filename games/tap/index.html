<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>SIMAB | گردونه شانس طلایی</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg: #0c0c14;
      --card-bg: rgba(20, 20, 32, 0.94);
      --card-inner: rgba(28, 28, 44, 0.88);
      --gold: #f5cf62;
      --gold-gradient: linear-gradient(135deg, #d4af37 0%, #f9e8a2 50%, #aa7c11 100%);
      --cyan: #00f2fe;
      --text: #ffffff;
      --text-muted: #9595a8;
      --border: rgba(212, 175, 55, 0.25);
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    html, body {
      width: 100%;
      min-height: 100vh;
      background: radial-gradient(circle at 50% 10%, #1e1338 0%, #0c0c14 70%);
      color: var(--text);
      display: flex;
      justify-content: center;
      overflow-x: hidden;
    }
    .app-wrapper {
      width: 100%;
      max-width: 100%;
      min-height: 100vh;
      padding: 10px 10px 40px 10px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      align-items: center;
    }
    @media (min-width: 500px) {
      .app-wrapper {
        max-width: 440px;
        box-shadow: 0 0 35px rgba(0,0,0,0.9);
        border-left: 1px solid rgba(255,255,255,0.05);
        border-right: 1px solid rgba(255,255,255,0.05);
      }
    }
    /* هدر */
    .top-header {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 10px 14px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
    }
    .btn-back {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid var(--border);
      color: var(--gold);
      width: 36px;
      height: 36px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      cursor: pointer;
      text-decoration: none;
    }
    .header-title {
      font-size: 16px;
      font-weight: 900;
      color: #fff;
    }
    .coin-badge {
      background: rgba(212, 175, 55, 0.12);
      border: 1px solid var(--border);
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: bold;
      color: var(--gold);
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .coin-badge-s {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: var(--gold-gradient);
      color: #221400;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      font-weight: 900;
    }

    /* کارت اصلی گردونه */
    .wheel-card {
      width: 100%;
      background: linear-gradient(135deg, rgba(35, 20, 60, 0.9) 0%, var(--card-bg) 100%);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 16px 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      box-shadow: 0 8px 30px rgba(0,0,0,0.6);
    }
    .wheel-title {
      font-size: 16px;
      font-weight: 900;
      color: var(--gold);
      margin-bottom: 2px;
    }
    .wheel-desc {
      font-size: 11px;
      color: var(--text-muted);
      margin-bottom: 14px;
    }

    /* صحنه گردونه و عقربه */
    .wheel-stage {
      position: relative;
      width: 290px;
      height: 290px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 10px 0 16px 0;
    }
    .wheel-pointer {
      position: absolute;
      top: -8px;
      left: 50%;
      transform: translateX(-50%);
      width: 0;
      height: 0;
      border-left: 14px solid transparent;
      border-right: 14px solid transparent;
      border-top: 24px solid #ff3b30;
      filter: drop-shadow(0 4px 8px rgba(0,0,0,0.8));
      z-index: 20;
    }
    .canvas-wrap {
      width: 270px;
      height: 270px;
      border-radius: 50%;
      border: 5px solid #d4af37;
      box-shadow: 0 0 25px rgba(212, 175, 55, 0.4), inset 0 0 15px rgba(0,0,0,0.9);
      overflow: hidden;
      position: relative;
      background: #111;
    }
    #wheelCanvas {
      width: 100%;
      height: 100%;
      transition: transform 4.5s cubic-bezier(0.12, 0.9, 0.15, 1);
    }
    .wheel-center-badge {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: radial-gradient(circle, #fff2ad 0%, #d4af37 60%, #593f00 100%);
      border: 3px solid #14141e;
      box-shadow: 0 0 12px rgba(0,0,0,0.8);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      font-weight: 900;
      color: #221400;
      z-index: 10;
    }

    /* دکمه چرخش */
    .btn-spin {
      width: 100%;
      background: var(--gold-gradient);
      color: #171000;
      border: none;
      padding: 14px;
      border-radius: 14px;
      font-size: 15px;
      font-weight: 900;
      cursor: pointer;
      box-shadow: 0 4px 20px rgba(212, 175, 55, 0.4);
      transition: 0.15s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .btn-spin:active { transform: scale(0.97); }
    .btn-spin:disabled {
      background: rgba(255, 255, 255, 0.08) !important;
      color: var(--text-muted) !important;
      cursor: not-allowed;
      box-shadow: none !important;
      border: 1px solid rgba(255,255,255,0.06);
    }

    /* لیست جوایز */
    .prizes-legend {
      width: 100%;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
      margin-top: 14px;
    }
    .legend-item {
      background: var(--card-inner);
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 10px;
      padding: 6px;
      text-align: center;
      font-size: 11px;
      font-weight: bold;
    }

    /* مودال برنده شدن */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.85);
      backdrop-filter: blur(6px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 100000;
      padding: 16px;
    }
    .modal-box {
      background: var(--card-bg);
      border: 2px solid var(--gold);
      border-radius: 20px;
      padding: 24px 20px;
      width: 100%;
      max-width: 320px;
      text-align: center;
      box-shadow: 0 10px 40px rgba(0,0,0,0.9);
    }
    .modal-icon { font-size: 48px; margin-bottom: 8px; }
    .modal-title { font-size: 17px; font-weight: 900; color: var(--gold); margin-bottom: 6px; }
    .modal-msg { font-size: 13px; color: #fff; margin-bottom: 16px; line-height: 1.5; }
    .btn-modal-close {
      width: 100%;
      background: var(--gold-gradient);
      color: #150f00;
      border: none;
      padding: 12px;
      border-radius: 12px;
      font-weight: 900;
      font-size: 13px;
      cursor: pointer;
    }

    .toast-msg {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%) translateY(-100px);
      background: var(--gold-gradient);
      color: #1a1200;
      padding: 8px 20px;
      border-radius: 25px;
      font-size: 12.5px;
      font-weight: 900;
      box-shadow: 0 4px 20px rgba(212, 175, 55, 0.6);
      z-index: 100001;
      transition: transform 0.3s ease;
      pointer-events: none;
    }
    .toast-msg.show { transform: translateX(-50%) translateY(0); }
  </style>
</head>
<body>
  <div class="toast-msg" id="toast-msg">انجام شد!</div>

  <div class="app-wrapper">
    <!-- هدر با دکمه بازگشت به لابی مادر -->
    <header class="top-header">
      <a href="../../index.html" class="btn-back" title="بازگشت به لابی">➔</a>
      <div class="header-title">گردونه شانس طلایی</div>
      <div class="coin-badge">
        <div class="coin-badge-s">S</div>
        <span id="user-balance">50</span>
      </div>
    </header>

    <div class="wheel-card">
      <div class="wheel-title">شانس خود را امتحان کنید!</div>
      <div class="wheel-desc">گردونه را بچرخانید و جوایز نقدی تا ۵۰ سکه برنده شوید.</div>

      <!-- صحنه گردونه -->
      <div class="wheel-stage">
        <div class="wheel-pointer"></div>
        <div class="canvas-wrap">
          <canvas id="wheelCanvas" width="270" height="270"></canvas>
          <div class="wheel-center-badge">S</div>
        </div>
      </div>

      <!-- دکمه چرخش -->
      <button class="btn-spin" id="btn-spin-action" onclick="spinWheel()">
        <span>چرخش گردونه (SPIN) 🎲</span>
      </button>

      <!-- لیست جوایز روی گردونه -->
      <div class="prizes-legend">
        <div class="legend-item" style="color:#ff7b72;">💨 پوچ</div>
        <div class="legend-item" style="color:var(--gold);">🪙 0.7 سکه</div>
        <div class="legend-item" style="color:var(--green);">🪙 1 سکه</div>
        <div class="legend-item" style="color:var(--cyan);">🪙 1.7 سکه</div>
        <div class="legend-item" style="color:#fce8b3;">🪙 10 سکه (۲۵٪)</div>
        <div class="legend-item" style="color:#ffd700;">👑 50 سکه (۱۵٪)</div>
      </div>
    </div>
  </div>

  <!-- پاپ‌آپ نتیجه چرخش -->
  <div class="modal-overlay" id="result-modal">
    <div class="modal-box">
      <div class="modal-icon" id="res-icon">🎉</div>
      <div class="modal-title" id="res-title">نتیجه گردونه</div>
      <div class="modal-msg" id="res-msg">تبریک! شما برنده شدید.</div>
      <button class="btn-modal-close" onclick="closeModal()">متوجه شدم</button>
    </div>
  </div>

  <script>
    const tg = window.Telegram?.WebApp;
    try {
      if (tg) {
        tg.ready();
        tg.expand();
        if (tg.BackButton) {
          tg.BackButton.show();
          tg.BackButton.onClick(() => { window.location.href = '../../index.html'; });
        }
      }
    } catch(e) {}

    let uid = "user_guest";
    try {
      if (tg?.initDataUnsafe?.user?.id) {
        uid = tg.initDataUnsafe.user.id.toString();
      }
    } catch(e) {}

    // همگام‌سازی سکه با لابی مادر
    const STORAGE_KEY_COINS = 'simor_coins_' + uid;
    let balance = parseFloat(localStorage.getItem(STORAGE_KEY_COINS) || localStorage.getItem('user_balance') || '50');
    function updateBalanceDisplay() {
      document.getElementById('user-balance').innerText = balance.toLocaleString();
    }
    updateBalanceDisplay();

    // ۶ قطاع گردونه
    const WHEEL_SECTORS = [
      { label: 'پوچ 💨', val: 0, color: '#2d1519', text: '#ff7b72', icon: '💨' },
      { label: '0.7 🪙', val: 0.7, color: '#4a1e75', text: '#ffffff', icon: '🎁' },
      { label: '1 🪙', val: 1.0, color: '#1a233a', text: '#00f5d4', icon: '🪙' },
      { label: '1.7 🪙', val: 1.7, color: '#0d3d38', text: '#ffffff', icon: '💎' },
      { label: '10 🪙', val: 10.0, color: '#664506', text: '#fce8b3', icon: '🌟' },
      { label: '50 👑', val: 50.0, color: '#d4af37', text: '#111111', icon: '👑' }
    ];

    // محاسبه دوره ۲۴ ساعته بر مبنای ساعت ۱۲:۰۰ ظهر به وقت انگلیس (12:00 UTC)
    function getCycleKey() {
      const now = new Date();
      // شیفت زمانی ۱۲ ساعت برای تغییر دوره در ۱۲ ظهر گرینویچ
      const shifted = new Date(now.getTime() - (12 * 60 * 60 * 1000));
      return `simab_wheel_${shifted.getUTCFullYear()}_${shifted.getUTCMonth()+1}_${shifted.getUTCDate()}_${uid}`;
    }

    const currentCycle = getCycleKey();
    let hasSpunInCycle = (localStorage.getItem(currentCycle) === 'true');

    function checkSpinStatus() {
      const btn = document.getElementById('btn-spin-action');
      if (hasSpunInCycle) {
        btn.disabled = true;
        btn.innerHTML = `<span>فردا امتحان کنین ⏳</span>`;
      } else {
        btn.disabled = false;
        btn.innerHTML = `<span>چرخش گردونه (SPIN) 🎲</span>`;
      }
    }

    // رسم گردونه بر روی بوم گرافیکی (Canvas)
    const canvas = document.getElementById('wheelCanvas');
    const ctx = canvas.getContext('2d');
    const numSectors = WHEEL_SECTORS.length; // ۶
    const arc = (2 * Math.PI) / numSectors; // ۶۰ درجه
    const radius = canvas.width / 2;

    function drawWheel() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      WHEEL_SECTORS.forEach((sec, i) => {
        const angle = i * arc;
        ctx.beginPath();
        ctx.fillStyle = sec.color;
        ctx.moveTo(radius, radius);
        ctx.arc(radius, radius, radius, angle, angle + arc);
        ctx.lineTo(radius, radius);
        ctx.fill();
        ctx.strokeStyle = 'rgba(212, 175, 55, 0.4)';
        ctx.lineWidth = 2;
        ctx.stroke();

        ctx.save();
        ctx.fillStyle = sec.text;
        ctx.font = 'bold 13px sans-serif';
        ctx.translate(radius, radius);
        ctx.rotate(angle + arc / 2);
        ctx.textAlign = 'right';
        ctx.fillText(sec.label, radius - 18, 5);
        ctx.restore();
      });
    }
    drawWheel();

    let currentRotation = 0;
    let isSpinning = false;

    // انتخاب رندوم با احتمالات دقیق درخواستی شما:
    // شانس ۱۰: ۲۵٪ | شانس ۵۰: ۱۵٪ | بقیه: ۶۰٪
    function pickWinningIndex() {
      const rand = Math.random() * 100;
      if (rand < 20) return 0;       // پوچ: ۲۰٪
      else if (rand < 35) return 1;  // 0.7 سکه: ۱۵٪
      else if (rand < 50) return 2;  // 1 سکه: ۱۵٪
      else if (rand < 60) return 3;  // 1.7 سکه: ۱۰٪
      else if (rand < 85) return 4;  // 10 سکه: ۲۵٪ (دقیقاً ۲۵ درصد)
      else return 5;                 // 50 سکه: ۱۵٪ (دقیقاً ۱۵ درصد)
    }

    function spinWheel() {
      if (isSpinning || hasSpunInCycle) return;
      isSpinning = true;

      const btn = document.getElementById('btn-spin-action');
      btn.disabled = true;

      if (tg?.HapticFeedback) tg.HapticFeedback.impactOccurred('heavy');

      const winningIndex = pickWinningIndex();
      const sectorDeg = 360 / numSectors; // ۶۰
      const targetCenter = (winningIndex * sectorDeg) + (sectorDeg / 2);
      const extraSpins = 5 * 360; // ۵ دور چرخش کامل

      // زاویه عقربه در بالا (۲۷۰ درجه)
      const stopAngle = extraSpins + ((270 - targetCenter - (currentRotation % 360) + 720) % 360);
      currentRotation += stopAngle;

      canvas.style.transform = `rotate(${currentRotation}deg)`;

      // ثبت استفاده برای این دوره ۲۴ ساعته
      hasSpunInCycle = true;
      localStorage.setItem(currentCycle, 'true');

      setTimeout(() => {
        isSpinning = false;
        const won = WHEEL_SECTORS[winningIndex];

        if (won.val > 0) {
          balance = parseFloat((balance + won.val).toFixed(2));
          localStorage.setItem(STORAGE_KEY_COINS, balance.toString());
          localStorage.setItem('user_balance', balance.toString());
          updateBalanceDisplay();

          if (tg?.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
          showModal(won.icon, 'تبریک! برنده شدید 🎉', `شما مبلغ <b>+${won.val} سکه</b> به موجودی خود اضافه کردید!`);
        } else {
          if (tg?.HapticFeedback) tg.HapticFeedback.notificationOccurred('warning');
          showModal('💨', 'پوچ شد!', 'متاسفانه این بار شانسی نداشتید. فردا دوباره امتحان کنید!');
        }

        checkSpinStatus();
      }, 4600);
    }

    function showModal(icon, title, msg) {
      document.getElementById('res-icon').innerText = icon;
      document.getElementById('res-title').innerText = title;
      document.getElementById('res-msg').innerHTML = msg;
      document.getElementById('result-modal').style.display = 'flex';
    }

    function closeModal() {
      document.getElementById('result-modal').style.display = 'none';
    }

    checkSpinStatus();
  </script>
</body>
</html>
