<!DOCTYPE html><html lang="fa" dir="rtl"><head><script src="../../assets/js/simab-i18n-v16.js?v=17"></script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>🎡 گردونهٔ سیماب | سیماب</title><script src="https://telegram.org/js/telegram-web-app.js"></script><link rel="stylesheet" href="../../assets/css/simab-common.css?v=10"><script src="../../assets/js/simab-wallet-client.js?v=17"></script><link rel="stylesheet" href="../../assets/css/simab-safe-area-v16.css?v=17"><script src="../../assets/js/simab-safe-area-v16.js?v=17" defer></script><link rel="stylesheet" href="../../assets/css/simab-refresh-v17.css?v=17"><script src="../../assets/js/simab-game-sound-v8.js?v=16"></script></head><body><main class="shell reward-shell"><header class="page-head"><h1>🎡 گردونهٔ سیماب</h1><a href="../../index.html">خانه ←</a></header><div class="balances"><div>موجودی سکه<b data-coins>—</b></div><div>ژتون<b data-chips>—</b></div></div><section class="panel" style="text-align:center"><h2>گردونهٔ رایگان روزانه</h2><div class="sound-row"><button id="reward-sound" type="button">🔊 صدا روشن</button></div><div class="wheel-frame"><div class="wheel-pointer">▼</div><div id="reward-wheel"><span class="wheel-label" style="--a:36deg">0</span><span class="wheel-label" style="--a:108deg">1</span><span class="wheel-label" style="--a:180deg">2</span><span class="wheel-label" style="--a:252deg">5</span><span class="wheel-label" style="--a:324deg">10</span><div class="wheel-hub">S</div></div></div><div class="wheel-prizes"><span>🪙 0</span><span>🪙 1</span><span>🪙 2</span><span>🪙 5</span><span>🪙 10</span></div><p>جایزه‌ها: ۰، ۱، ۲، ۵ یا ۱۰ سکه</p><p class="muted">هر روز UTC یک چرخش. نتیجه از سرور می‌آید؛ تغییر ساعت گوشی جایزهٔ اضافه نمی‌سازد.</p><button id="claim" disabled>در حال اتصال…</button><p id="reward-result" class="status" role="status"></p></section><p class="muted">سکه‌ها مجازی‌اند؛ برداشت نقدی وجود ندارد. موجودی در تمام بخش‌های سیماب مشترک است.</p></main><script>let busy=false;document.getElementById('reward-sound').onclick=function(){SimabSound.toggle(this);};SimabWallet.subscribe(s=>{document.getElementById('claim').disabled=busy||!s.wheelAvailable;document.getElementById('claim').textContent=s.wheelAvailable?'چرخش رایگان امروز':'✓ گردونهٔ امروز انجام شد';});document.getElementById('claim').onclick=async()=>{if(busy)return;SimabSound.unlock();SimabSound.play('roll');busy=true;document.getElementById('claim').disabled=true;try{const r=await SimabWallet.mutate('wallet',{walletAction:'wheel',amount:0});const prize=r.result?.wheelReward??r.rewardCoins??0;const index=[0,1,2,5,10].indexOf(prize),wheel=document.getElementById('reward-wheel');const reduce=matchMedia('(prefers-reduced-motion:reduce)').matches;wheel.style.transition=reduce?'none':'transform 2.8s cubic-bezier(.12,.8,.2,1)';let stopped=false;const tick=(i=0)=>{if(stopped||i>22)return;SimabSound.play('tap');setTimeout(()=>tick(i+1),45+i*9);};if(!reduce)tick();wheel.style.transform='rotate('+(1800+360-(index*72+36))+'deg)';await new Promise(r=>setTimeout(r,reduce?50:2850));stopped=true;if(!r.duplicate&&!r.result?.alreadySpun)SimabSound.play(prize?'win':'chip');document.getElementById('reward-result').textContent=r.duplicate||r.result?.alreadySpun?'این چرخش قبلاً ثبت شده بود.':prize.toLocaleString('fa-IR')+' سکه در کیف پول ثبت شد.';}catch(e){document.getElementById('reward-result').textContent=e.message;}finally{busy=false;document.getElementById('claim').disabled=!SimabWallet.state?.wheelAvailable;}};</script></body></html>
