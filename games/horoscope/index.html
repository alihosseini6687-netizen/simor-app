<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>SIMAB | ماینر ابری توکن</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg: #0c0c14;
      --card-bg: rgba(20, 20, 32, 0.94);
      --card-inner: rgba(28, 28, 44, 0.88);
      --gold: #f5cf62;
      --gold-gradient: linear-gradient(135deg, #d4af37 0%, #f9e8a2 50%, #aa7c11 100%);
      --cyan: #00f2fe;
      --purple: #9d4edd;
      --green: #00f5d4;
      --text: #ffffff;
      --text-muted: #9595a8;
      --border: rgba(212, 175, 55, 0.25);
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    html, body {
      width: 100%;
      min-height: 100vh;
      background: radial-gradient(circle at 50% 10%, #1e1338 0%, #0c0c14 70%);
      color: var(--text);
      display: flex;
      justify-content: center;
      overflow-x: hidden;
    }
    .app-wrapper {
      width: 100%;
      max-width: 100%;
      min-height: 100vh;
      padding: 10px 10px 40px 10px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    @media (min-width: 500px) {
      .app-wrapper {
        max-width: 440px;
        box-shadow: 0 0 35px rgba(0,0,0,0.9);
        border-left: 1px solid rgba(255,255,255,0.05);
        border-right: 1px solid rgba(255,255,255,0.05);
      }
    }
    /* هدر */
    .top-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 10px 14px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
    }
    .btn-back {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid var(--border);
      color: var(--gold);
      width: 36px;
      height: 36px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      cursor: pointer;
      text-decoration: none;
    }
    .header-title {
      font-size: 16px;
      font-weight: 900;
      color: #fff;
    }
    .coin-badge {
      background: rgba(212, 175, 55, 0.12);
      border: 1px solid var(--border);
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: bold;
      color: var(--gold);
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .coin-badge-s {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: var(--gold-gradient);
      color: #221400;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      font-weight: 900;
    }

    /* کارت دستگاه فعال */
    .active-rig-card {
      background: linear-gradient(135deg, rgba(35, 20, 60, 0.9) 0%, var(--card-bg) 100%);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 18px 14px;
      text-align: center;
      box-shadow: 0 8px 30px rgba(0,0,0,0.6);
      position: relative;
    }
    .rig-tier-badge {
      display: inline-block;
      background: rgba(212, 175, 55, 0.15);
      border: 1px solid var(--gold);
      color: var(--gold);
      font-size: 11.5px;
      font-weight: 900;
      padding: 4px 14px;
      border-radius: 20px;
      margin-bottom: 10px;
    }
    .rig-gear-icon {
      font-size: 44px;
      margin-bottom: 4px;
      display: inline-block;
      animation: rotateRig 8s linear infinite;
    }
    .rig-gear-icon.paused { animation-play-state: paused; opacity: 0.5; }
    @keyframes rotateRig { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

    .rig-live-val {
      font-size: 34px;
      font-weight: 900;
      color: #fff;
      margin-bottom: 2px;
      letter-spacing: 0.5px;
    }
    .rig-rate-lbl {
      font-size: 11.5px;
      color: var(--cyan);
      margin-bottom: 14px;
    }

    /* نوار پیشرفت */
    .progress-box {
      background: rgba(0, 0, 0, 0.4);
      border-radius: 12px;
      padding: 10px;
      border: 1px solid rgba(255,255,255,0.06);
      margin-bottom: 10px;
    }
    .progress-row-info {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      color: var(--text-muted);
      margin-bottom: 6px;
    }
    .bar-bg {
      width: 100%;
      height: 10px;
      background: #1e1e2c;
      border-radius: 6px;
      overflow: hidden;
      margin-bottom: 6px;
    }
    .bar-fill-daily {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--cyan), var(--green));
      border-radius: 6px;
      transition: width 0.3s;
    }
    .bar-fill-tank {
      height: 100%;
      width: 100%;
      background: var(--gold-gradient);
      border-radius: 6px;
      transition: width 0.3s;
    }

    /* دکمه‌ها */
    .btn-claim {
      width: 100%;
      background: var(--gold-gradient);
      color: #171000;
      border: none;
      padding: 13px;
      border-radius: 14px;
      font-size: 14px;
      font-weight: 900;
      cursor: pointer;
      box-shadow: 0 4px 20px rgba(212, 175, 55, 0.4);
      transition: 0.15s;
      margin-bottom: 8px;
    }
    .btn-claim:active { transform: scale(0.97); }
    .btn-claim:disabled {
      background: rgba(255, 255, 255, 0.08) !important;
      color: var(--text-muted) !important;
      cursor: not-allowed;
      box-shadow: none !important;
      border: 1px solid rgba(255,255,255,0.06);
    }
    .btn-recharge {
      width: 100%;
      background: rgba(0, 245, 212, 0.15);
      border: 1px solid var(--green);
      color: var(--green);
      padding: 11px;
      border-radius: 12px;
      font-size: 13px;
      font-weight: 900;
      cursor: pointer;
      transition: 0.15s;
    }
    .btn-recharge:active { transform: scale(0.97); }

    /* کاتالوگ فروشگاه ماینرها */
    .section-title {
      font-size: 14px;
      font-weight: 900;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 6px;
      margin-top: 10px;
      margin-bottom: 4px;
    }
    .shop-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .shop-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: 0.15s;
    }
    .shop-card.active-owned {
      border-color: var(--green);
      background: rgba(0, 245, 212, 0.06);
    }
    .shop-info {
      display: flex;
      flex-direction: column;
      gap: 4px;
      text-align: start;
    }
    .shop-tier-name {
      font-size: 13.5px;
      font-weight: 900;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .shop-specs {
      font-size: 11px;
      color: var(--text-muted);
      line-height: 1.5;
    }
    .btn-buy {
      background: var(--gold-gradient);
      color: #171000;
      border: none;
      padding: 10px 16px;
      border-radius: 10px;
      font-size: 12px;
      font-weight: 800;
      cursor: pointer;
      white-space: nowrap;
    }
    .btn-buy.active-badge {
      background: rgba(0, 245, 212, 0.15);
      border: 1px solid var(--green);
      color: var(--green);
      cursor: default;
    }

    .toast-msg {
      position: fixed; top: 20px; left: 50%; transform: translateX(-50%) translateY(-100px);
      background: var(--gold-gradient); color: #1a1200; padding: 8px 20px; border-radius: 25px;
      font-size: 12.5px; font-weight: 900; box-shadow: 0 4px 20px rgba(212, 175, 55, 0.6);
      z-index: 100001; transition: transform 0.3s ease; pointer-events: none;
    }
    .toast-msg.show { transform: translateX(-50%) translateY(0); }
  </style>
</head>
<body>
  <div class="toast-msg" id="toast-msg">انجام شد!</div>

  <div class="app-wrapper">
    <!-- هدر با بازگشت هوشمند به لابی -->
    <header class="top-header">
      <a href="../../index.html" class="btn-back" id="btn-back-nav" title="بازگشت به لابی">➔</a>
      <div class="header-title">ماینر ابری سیماب</div>
      <div class="coin-badge">
        <div class="coin-badge-s">S</div>
        <span id="user-balance">50</span>
      </div>
    </header>

    <!-- کارت وضعیت ماینر فعال -->
    <div class="active-rig-card">
      <div class="rig-tier-badge" id="rig-badge">هیچ دستگاهی فعال نیست</div>
      <div>
        <span class="rig-gear-icon paused" id="rig-gear">⚙️</span>
      </div>
      <div class="rig-live-val" id="rig-mined-display">خاموش</div>
      <div class="rig-rate-lbl" id="rig-rate-desc">یک ماینر از لیست زیر خریداری کنید</div>

      <!-- نوار دوره ۲۴ ساعته -->
      <div class="progress-box">
        <div class="progress-row-info">
          <span>دوره ۲۴ ساعته استخراج:</span>
          <span id="cycle-timer-txt">--:--:--</span>
        </div>
        <div class="bar-bg">
          <div class="bar-fill-daily" id="daily-bar"></div>
        </div>
        <div class="progress-row-info" style="margin-bottom:0;">
          <span>استخراج دوره فعلی:</span>
          <span id="cycle-mined-txt">۰ S</span>
        </div>
      </div>

      <!-- نوار مخزن کل دستگاه -->
      <div class="progress-box" style="margin-bottom: 14px;">
        <div class="progress-row-info">
          <span>ظرفیت باقی‌مانده مخزن:</span>
          <span id="tank-val-txt">۰ / ۰ S</span>
        </div>
        <div class="bar-bg">
          <div class="bar-fill-tank" id="tank-bar"></div>
        </div>
      </div>

      <!-- دکمه برداشت سکه -->
      <button class="btn-claim" id="btn-claim-action" onclick="handleMinerAction()">
        <span>ابتدا ماینر بخرید 🔒</span>
      </button>

      <!-- دکمه شارژ مجدد مخزن -->
      <button class="btn-recharge" id="btn-recharge-action" style="display:none;" onclick="rechargeMinerTank()">
        <span>شارژ مجدد مخزن 🔄</span>
      </button>
    </div>

    <!-- فروشگاه و ارتقای ۴ قدرت ماینر -->
    <div class="section-title">
      <span>🛒</span>
      <span>خرید و ارتقای سطوح ماینر:</span>
    </div>

    <div class="shop-list" id="shop-container"></div>
  </div>

  <script>
    const tg = window.Telegram?.WebApp;
    try {
      if (tg) {
        tg.ready();
        tg.expand();
        if (tg.BackButton) {
          tg.BackButton.show();
          tg.BackButton.onClick(() => { window.location.href = '../../index.html'; });
        }
      }
    } catch(e) {}

    let uid = "user_guest";
    try {
      if (tg?.initDataUnsafe?.user?.id) {
        uid = tg.initDataUnsafe.user.id.toString();
      }
    } catch(e) {}

    document.getElementById('btn-back-nav').onclick = (e) => {
      e.preventDefault();
      if (window.history.length > 1) window.history.back();
      else window.location.href = '../../index.html';
    };

    // موجودی سکه
    const STORAGE_KEY_COINS = 'simor_coins_' + uid;
    let balance = parseFloat(localStorage.getItem(STORAGE_KEY_COINS) || localStorage.getItem('user_balance') || '50');
    function updateBalanceDisplay() {
      document.getElementById('user-balance').innerText = balance.toLocaleString();
    }
    updateBalanceDisplay();

    // مشخصات ۴ سطح ماینر طبق سیستم اقتصادی شما
    const MINER_TIERS = {
      1: { name: 'ماینر سطح ۱ (مقدماتی)', cost: 50, daily: 30, tank: 120, recharge: 40 },
      2: { name: 'ماینر سطح ۲ (پیشرفته)', cost: 150, daily: 75, tank: 240, recharge: 120 },
      3: { name: 'ماینر سطح ۳ (توربو)', cost: 500, daily: 250, tank: 1850, recharge: 400 },
      4: { name: 'ماینر سطح ۴ (اولترا)', cost: 2000, daily: 500, tank: 8000, recharge: 1800 }
    };

    const CYCLE_DURATION_MS = 24 * 60 * 60 * 1000; // ۲۴ ساعت
    const KEY_TIER = 'simab_miner_tier_' + uid;
    const KEY_TANK = 'simab_miner_tank_' + uid;
    const KEY_START = 'simab_miner_cycle_start_' + uid;

    let currentTier = parseInt(localStorage.getItem(KEY_TIER) || '0', 10);
    let tankRemaining = parseFloat(localStorage.getItem(KEY_TANK) || '0');
    let cycleStart = parseInt(localStorage.getItem(KEY_START) || '0', 10);

    function showToast(text) {
      const t = document.getElementById('toast-msg');
      t.innerText = text;
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 2200);
    }

    function updateMinerEngine() {
      const gear = document.getElementById('rig-gear');
      const badge = document.getElementById('rig-badge');
      const minedTxt = document.getElementById('rig-mined-display');
      const rateDesc = document.getElementById('rig-rate-desc');
      const timerTxt = document.getElementById('cycle-timer-txt');
      const cycleMinedTxt = document.getElementById('cycle-mined-txt');
      const dailyBar = document.getElementById('daily-bar');
      const tankTxt = document.getElementById('tank-val-txt');
      const tankBar = document.getElementById('tank-bar');
      const btnClaim = document.getElementById('btn-claim-action');
      const btnRecharge = document.getElementById('btn-recharge-action');

      if (!badge) return;

      if (currentTier === 0) {
        badge.innerText = 'هیچ دستگاهی فعال نیست';
        gear.classList.add('paused');
        minedTxt.innerText = 'خاموش';
        rateDesc.innerText = 'برای شروع، ماینر سطح ۱ را از لیست زیر بخرید';
        timerTxt.innerText = '--:--:--';
        cycleMinedTxt.innerText = '۰ S';
        dailyBar.style.width = '0%';
        tankTxt.innerText = '۰ / ۰ S';
        tankBar.style.width = '0%';
        btnClaim.disabled = true;
        btnClaim.innerHTML = `<span>ابتدا ماینر بخرید 🔒</span>`;
        btnRecharge.style.display = 'none';
        return;
      }

      const cfg = MINER_TIERS[currentTier];
      badge.innerText = cfg.name;
      rateDesc.innerText = `استخراج روزانه: ${cfg.daily} سکه | مخزن کل: ${cfg.tank} سکه`;

      const tankPct = Math.max(0, Math.min(100, (tankRemaining / cfg.tank) * 100));
      tankTxt.innerText = `${tankRemaining.toFixed(1)} / ${cfg.tank} S`;
      tankBar.style.width = `${tankPct}%`;

      if (tankRemaining <= 0) {
        gear.classList.add('paused');
        minedTxt.innerText = 'مخزن تمام شد!';
        timerTxt.innerText = 'نیاز به شارژ';
        dailyBar.style.width = '0%';
        btnClaim.disabled = true;
        btnClaim.innerHTML = `<span>مخزن خالی است ⚠️</span>`;
        btnRecharge.style.display = 'block';
        btnRecharge.innerHTML = `<span>شارژ مجدد مخزن (${cfg.recharge} 🪙) 🔄</span>`;
        return;
      } else {
        btnRecharge.style.display = 'none';
      }

      const now = Date.now();
      const elapsed = Math.max(0, now - cycleStart);
      const isCycleFinished = (elapsed >= CYCLE_DURATION_MS);

      const cyclePct = Math.min(100, (elapsed / CYCLE_DURATION_MS) * 100);
      dailyBar.style.width = `${cyclePct}%`;

      const cycleMined = Math.min(cfg.daily, Math.min(tankRemaining, (elapsed / CYCLE_DURATION_MS) * cfg.daily));
      minedTxt.innerText = `${cycleMined.toFixed(2)} S`;
      cycleMinedTxt.innerText = `${cycleMined.toFixed(1)} / ${cfg.daily} سکه`;

      if (isCycleFinished) {
        gear.classList.add('paused');
        timerTxt.innerText = 'آماده برداشت ✅';
        btnClaim.disabled = false;
        btnClaim.innerHTML = `<span>برداشت ${cycleMined.toFixed(0)} سکه و شروع روز بعد ✨</span>`;
      } else {
        gear.classList.remove('paused');
        const remainingMs = CYCLE_DURATION_MS - elapsed;
        const hrs = Math.floor(remainingMs / (1000 * 60 * 60));
        const mins = Math.floor((remainingMs % (1000 * 60 * 60)) / (1000 * 60));
        const secs = Math.floor((remainingMs % (1000 * 60)) / 1000);
        timerTxt.innerText = `${String(hrs).padStart(2,'0')}:${String(mins).padStart(2,'0')}:${String(secs).padStart(2,'0')} باقی‌مانده`;
        btnClaim.disabled = true;
        btnClaim.innerHTML = `<span>در حال استخراج خودکار... ⏳</span>`;
      }
    }

    function handleMinerAction() {
      if (currentTier === 0) return;
      const cfg = MINER_TIERS[currentTier];
      const now = Date.now();
      const elapsed = Math.max(0, now - cycleStart);
      if (elapsed < CYCLE_DURATION_MS || tankRemaining <= 0) return;

      const claimAmount = Math.min(cfg.daily, tankRemaining);
      balance = parseFloat((balance + claimAmount).toFixed(2));
      tankRemaining = parseFloat((tankRemaining - claimAmount).toFixed(2));
      cycleStart = Date.now();

      localStorage.setItem(STORAGE_KEY_COINS, balance.toString());
      localStorage.setItem('user_balance', balance.toString());
      localStorage.setItem(KEY_TANK, tankRemaining.toString());
      localStorage.setItem(KEY_START, cycleStart.toString());

      updateBalanceDisplay();
      updateMinerEngine();
      renderShop();

      if (tg?.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
      showToast(`+${claimAmount} سکه با موفقیت برداشت شد! 🎉`);
    }

    function rechargeMinerTank() {
      if (currentTier === 0) return;
      const cfg = MINER_TIERS[currentTier];
      if (balance < cfg.recharge) {
        if (tg?.HapticFeedback) tg.HapticFeedback.notificationOccurred('error');
        showToast(`موجودی کافی نیست! به ${cfg.recharge} سکه نیاز دارید.`);
        return;
      }
      balance -= cfg.recharge;
      tankRemaining = cfg.tank;
      cycleStart = Date.now();

      localStorage.setItem(STORAGE_KEY_COINS, balance.toString());
      localStorage.setItem('user_balance', balance.toString());
      localStorage.setItem(KEY_TANK, tankRemaining.toString());
      localStorage.setItem(KEY_START, cycleStart.toString());

      updateBalanceDisplay();
      updateMinerEngine();
      renderShop();

      if (tg?.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
      showToast(`مخزن ماینر با ظرفیت کامل (${cfg.tank} S) مجدداً شارژ شد! ⚡`);
    }

    function buyOrUpgradeMiner(tierNum) {
      const target = MINER_TIERS[tierNum];
      if (currentTier === tierNum) return;

      if (balance < target.cost) {
        if (tg?.HapticFeedback) tg.HapticFeedback.notificationOccurred('error');
        showToast(`موجودی کافی نیست! به ${target.cost} سکه نیاز دارید.`);
        return;
      }

      balance -= target.cost;
      currentTier = tierNum;
      tankRemaining = target.tank;
      cycleStart = Date.now();

      localStorage.setItem(STORAGE_KEY_COINS, balance.toString());
      localStorage.setItem('user_balance', balance.toString());
      localStorage.setItem(KEY_TIER, currentTier.toString());
      localStorage.setItem(KEY_TANK, tankRemaining.toString());
      localStorage.setItem(KEY_START, cycleStart.toString());

      updateBalanceDisplay();
      updateMinerEngine();
      renderShop();

      if (tg?.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
      showToast(`${target.name} با موفقیت فعال شد! 🚀`);
    }

    function renderShop() {
      const container = document.getElementById('shop-container');
      if (!container) return;
      container.innerHTML = '';

      const tierList =;
      for (let i = 0; i < tierList.length; i++) {
        const t = tierList[i];
        const item = MINER_TIERS[t];
        const card = document.createElement('div');
        const isCurrent = (currentTier === t);
        card.className = `shop-card ${isCurrent ? 'active-owned' : ''}`;

        let btnHtml = '';
        if (isCurrent) {
          btnHtml = `<span class="btn-buy active-badge">سطح فعال شما ✓</span>`;
        } else if (currentTier === 0) {
          btnHtml = `<button class="btn-buy" onclick="buyOrUpgradeMiner(${t})">خرید (${item.cost} 🪙)</button>`;
        } else if (t > currentTier) {
          btnHtml = `<button class="btn-buy" onclick="buyOrUpgradeMiner(${t})">ارتقا (${item.cost} 🪙)</button>`;
        } else {
          btnHtml = `<span style="font-size:11px; color:var(--text-muted);">سپری شده</span>`;
        }

        card.innerHTML = `
          <div class="shop-info">
            <div class="shop-tier-name">
              <span>⚡</span>
              <span>${item.name}</span>
            </div>
            <div class="shop-specs">
              • استخراج: <b>${item.daily} سکه</b> در ۲۴ ساعت<br>
              • ظرفیت کل مخزن: <b>${item.tank} سکه</b> (شارژ مجدد: ${item.recharge} 🪙)
            </div>
          </div>
          <div>${btnHtml}</div>
        `;
        container.appendChild(card);
      }
    }

    renderShop();
    updateMinerEngine();
    setInterval(updateMinerEngine, 1000);
  </script>
</body>
</html>
