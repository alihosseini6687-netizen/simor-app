<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>SIMAB | دعوت دوستان و رفرال</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg: #0c0c14;
      --card-bg: rgba(20, 20, 32, 0.94);
      --card-inner: rgba(28, 28, 44, 0.88);
      --gold: #f5cf62;
      --gold-gradient: linear-gradient(135deg, #d4af37 0%, #f9e8a2 50%, #aa7c11 100%);
      --cyan: #00f2fe;
      --text: #ffffff;
      --text-muted: #9595a8;
      --border: rgba(212, 175, 55, 0.22);
      --green: #00f5d4;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    html, body {
      width: 100%;
      min-height: 100vh;
      background: radial-gradient(circle at 50% 10%, #1e1338 0%, #0c0c14 70%);
      color: var(--text);
      display: flex;
      justify-content: center;
      overflow-x: hidden;
    }
    .app-wrapper {
      width: 100%;
      max-width: 100%;
      min-height: 100vh;
      padding: 10px 10px 40px 10px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    @media (min-width: 500px) {
      .app-wrapper {
        max-width: 440px;
        box-shadow: 0 0 35px rgba(0,0,0,0.9);
        border-left: 1px solid rgba(255,255,255,0.05);
        border-right: 1px solid rgba(255,255,255,0.05);
      }
    }
    .top-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 10px 14px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
    }
    .btn-back {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid var(--border);
      color: var(--gold);
      width: 36px;
      height: 36px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      cursor: pointer;
      text-decoration: none;
    }
    .header-title {
      font-size: 16px;
      font-weight: 900;
      color: #fff;
    }
    .coin-badge {
      background: rgba(212, 175, 55, 0.12);
      border: 1px solid var(--border);
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: bold;
      color: var(--gold);
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .coin-badge-s {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: var(--gold-gradient);
      color: #221400;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      font-weight: 900;
    }
    .ref-hero-card {
      background: linear-gradient(135deg, rgba(35, 20, 60, 0.9) 0%, var(--card-bg) 100%);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 16px;
      text-align: center;
      box-shadow: 0 6px 20px rgba(0,0,0,0.5);
    }
    .ref-icon {
      font-size: 40px;
      margin-bottom: 6px;
    }
    .ref-title {
      font-size: 16px;
      font-weight: 900;
      color: var(--gold);
      margin-bottom: 4px;
    }
    .ref-desc {
      font-size: 11.5px;
      color: var(--text-muted);
      line-height: 1.5;
      margin-bottom: 14px;
    }
    .ref-code-box {
      background: var(--card-inner);
      border: 1px dashed var(--border);
      border-radius: 12px;
      padding: 10px 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }
    .ref-code-label {
      font-size: 11px;
      color: var(--text-muted);
    }
    .ref-code-val {
      font-family: monospace;
      font-size: 14px;
      font-weight: bold;
      color: var(--cyan);
      letter-spacing: 1px;
      direction: ltr;
    }
    .ref-actions {
      display: flex;
      gap: 8px;
    }
    .btn-ref-primary {
      flex: 1;
      background: var(--gold-gradient);
      color: #1a1200;
      border: none;
      padding: 12px;
      border-radius: 12px;
      font-size: 13px;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .btn-ref-secondary {
      background: rgba(255,255,255,0.08);
      border: 1px solid var(--border);
      color: #fff;
      padding: 12px 16px;
      border-radius: 12px;
      font-size: 13px;
      font-weight: bold;
      cursor: pointer;
    }
    .ref-stats-row {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
    }
    .stat-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 12px;
      text-align: center;
    }
    .stat-num {
      font-size: 20px;
      font-weight: 900;
      color: var(--gold);
      margin-bottom: 2px;
    }
    .stat-lbl {
      font-size: 10.5px;
      color: var(--text-muted);
    }
    .section-title {
      font-size: 14px;
      font-weight: 800;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 6px;
      margin-top: 4px;
    }
    .tasks-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .task-item {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 12px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: 0.15s;
    }
    .task-info {
      display: flex;
      flex-direction: column;
      gap: 3px;
    }
    .task-target {
      font-size: 13px;
      font-weight: 800;
      color: #fff;
    }
    .task-reward {
      font-size: 11px;
      color: var(--gold);
      display: flex;
      align-items: center;
      gap: 4px;
      font-weight: bold;
    }
    .btn-claim {
      background: var(--gold-gradient);
      color: #171000;
      border: none;
      padding: 8px 14px;
      border-radius: 10px;
      font-size: 11.5px;
      font-weight: 800;
      cursor: pointer;
      transition: 0.15s;
    }
    .btn-claim:disabled {
      background: rgba(255, 255, 255, 0.08);
      color: var(--text-muted);
      cursor: not-allowed;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }
    .btn-claim.claimed {
      background: rgba(0, 245, 212, 0.12);
      color: var(--green);
      border: 1px solid var(--green);
    }
    .toast-msg {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%) translateY(-100px);
      background: var(--gold-gradient);
      color: #1a1200;
      padding: 8px 20px;
      border-radius: 25px;
      font-size: 12.5px;
      font-weight: 900;
      box-shadow: 0 4px 20px rgba(212, 175, 55, 0.6);
      z-index: 100001;
      transition: transform 0.3s ease;
      pointer-events: none;
    }
    .toast-msg.show {
      transform: translateX(-50%) translateY(0);
    }
  </style>
</head>
<body>
  <div class="toast-msg" id="toast-msg">کپی شد!</div>
  <div class="app-wrapper">
    <header class="top-header">
      <a href="../index.html" class="btn-back" title="بازگشت به خانه">➔</a>
      <div class="header-title">دعوت دوستان (رفرال)</div>
      <div class="coin-badge">
        <div class="coin-badge-s">S</div>
        <span id="user-balance">50</span>
      </div>
    </header>

    <div class="ref-hero-card">
      <div class="ref-icon">👥</div>
      <div class="ref-title">دوستانت را دعوت کن، سکه بگیر!</div>
      <div class="ref-desc">با ارسال کد و لینک اختصاصی خود، دوستانتان را به سیماب بیاورید و جوایز میلیونی دریافت کنید.</div>
      <div class="ref-code-box">
        <span class="ref-code-label">شناسه اختصاصی شما:</span>
        <span class="ref-code-val" id="my-game-id">S0000000</span>
      </div>
      <div class="ref-actions">
        <button class="btn-ref-primary" onclick="shareTelegram()">
          <span>ارسال به دوستان 🚀</span>
        </button>
        <button class="btn-ref-secondary" onclick="copyRefLink()">کپی لینک 📋</button>
      </div>
    </div>

    <div class="ref-stats-row">
      <div class="stat-card">
        <div class="stat-num" id="total-invites-count">0</div>
        <div class="stat-lbl">تعداد دوستان دعوت‌شده</div>
      </div>
      <div class="stat-card">
        <div class="stat-num" id="total-earned-coins">0</div>
        <div class="stat-lbl">مجموع سکه‌های کسب‌شده</div>
      </div>
    </div>

    <div class="section-title">
      <span>🎁</span>
      <span>جوایز پلکانی دعوت دوستان</span>
    </div>
    <div class="tasks-list" id="tasks-container"></div>
  </div>

  <script>
    const tg = window.Telegram?.WebApp;
    try {
      if (tg) {
        tg.ready();
        tg.expand();
        // ۱. فعال‌سازی فلش بازگشت در بالای تلگرام
        if (tg.BackButton) {
          tg.BackButton.show();
          tg.BackButton.onClick(() => { window.location.href = '../index.html'; });
        }
      }
    } catch(e) {}

    let uid = "guest";
    try {
      if (tg?.initDataUnsafe?.user?.id) {
        uid = tg.initDataUnsafe.user.id.toString();
      }
    } catch(e) {}

    // ۲. تفکیک شناسه بازی برای جلوگیری از سرایت شناسه ادمین به سایر اکانت‌ها
    let gameId = localStorage.getItem('simab_game_id_' + uid) || localStorage.getItem('simab_game_id');
    if (uid === "702007470") {
      gameId = "S5895861";
    } else if (!gameId || gameId === "S5895861") {
      gameId = 'S' + Math.floor(1000000 + Math.random() * 9000000);
      localStorage.setItem('simab_game_id_' + uid, gameId);
      localStorage.setItem('simab_game_id', gameId);
    }
    document.getElementById('my-game-id').innerText = gameId;

    // ۳. اتصال به ابری تلگرام و حذف کلید مشترک قدیمی
    const CLOUD_KEY_PROFILE = 'simab_user_data_v1';
    const STORAGE_KEY_COINS = 'simor_coins_' + uid;
    const isCloudSupported = !!(tg && tg.CloudStorage);

    let balance = 50;
    if (uid === "702007470") {
      balance = parseFloat(localStorage.getItem(STORAGE_KEY_COINS) || '2175000');
    } else if (uid !== "guest") {
      let saved = parseFloat(localStorage.getItem(STORAGE_KEY_COINS) || '50');
      if (saved >= 100000) saved = 50;
      balance = saved;
    }

    function updateBalanceDisplay() {
      document.getElementById('user-balance').innerText = Number(balance).toLocaleString();
      localStorage.setItem(STORAGE_KEY_COINS, balance.toString());
      localStorage.removeItem('user_balance');

      const payload = {
        coins: balance,
        chips: parseInt(localStorage.getItem('simab_chips_' + uid) || '0', 10),
        inv: JSON.parse(localStorage.getItem('simab_chips_inv_' + uid) || '{"c1":0,"c5":0,"c25":0,"c100":0,"c500":0}'),
        updated_at: Date.now()
      };
      localStorage.setItem('simab_last_sync_time', payload.updated_at.toString());
      if (isCloudSupported && uid !== "guest") {
        tg.CloudStorage.setItem(CLOUD_KEY_PROFILE, JSON.stringify(payload));
      }
    }
    updateBalanceDisplay();

    function syncWithTelegramCloud() {
      if (!isCloudSupported || uid === "guest") return;
      tg.CloudStorage.getItem(CLOUD_KEY_PROFILE, (err, cloudRaw) => {
        if (err || !cloudRaw) return;
        try {
          const cloudData = JSON.parse(cloudRaw);
          const localTime = parseInt(localStorage.getItem('simab_last_sync_time') || '0', 10);
          if (cloudData.updated_at && cloudData.updated_at >= localTime) {
            if (typeof cloudData.coins === 'number') {
              if (uid !== "702007470" && cloudData.coins >= 100000) return;
              balance = cloudData.coins;
              localStorage.setItem(STORAGE_KEY_COINS, balance.toString());
              document.getElementById('user-balance').innerText = Number(balance).toLocaleString();
            }
          }
        } catch(e) {}
      });
    }
    syncWithTelegramCloud();

    // ۴. شمارنده هماهنگ دعوت‌ها بر اساس کد بازی و آیدی تلگرام
    let inviteCount = parseInt(localStorage.getItem('simab_ref_count_' + gameId) || localStorage.getItem('simab_ref_count_' + uid) || '0', 10);
    const referralMilestones = [
      { count: 1, reward: 10 },
      { count: 3, reward: 35 },
      { count: 7, reward: 95 },
      { count: 15, reward: 199 },
      { count: 29, reward: 399 },
      { count: 59, reward: 701 },
      { count: 99, reward: 1111 }
    ];

    function showToast(text) {
      const t = document.getElementById('toast-msg');
      t.innerText = text;
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 2000);
    }

    function renderTasks() {
      document.getElementById('total-invites-count').innerText = inviteCount;
      const container = document.getElementById('tasks-container');
      container.innerHTML = '';
      let totalEarned = 0;

      referralMilestones.forEach(m => {
        const claimKey = `simab_ref_claimed_${m.count}_${uid}`;
        const isClaimed = localStorage.getItem(claimKey) === 'true';
        if (isClaimed) totalEarned += m.reward;
        const item = document.createElement('div');
        item.className = 'task-item';
        const canClaim = inviteCount >= m.count && !isClaimed;
        let btnHtml = '';
        if (isClaimed) {
          btnHtml = `<button class="btn-claim claimed" disabled>دریافت شد ✓</button>`;
        } else if (canClaim) {
          btnHtml = `<button class="btn-claim" onclick="claimReward(${m.count}, ${m.reward})">دریافت هدیه ✨</button>`;
        } else {
          btnHtml = `<button class="btn-claim" disabled>قفل (${inviteCount}/${m.count}) 🔒</button>`;
        }
        item.innerHTML = `
          <div class="task-info">
            <div class="task-target">دعوت ${m.count} دوست</div>
            <div class="task-reward"><span>🪙 پاداش:</span> <b>${m.reward.toLocaleString()} سکه</b></div>
          </div>
          <div>${btnHtml}</div>
        `;
        container.appendChild(item);
      });
      document.getElementById('total-earned-coins').innerText = totalEarned.toLocaleString();
    }

    function claimReward(targetCount, rewardCoins) {
    if (inviteCount < targetCount) return;
    const claimKey = `simab_ref_claimed_${targetCount}_${uid}`;
    localStorage.setItem(claimKey, 'true');

    // افزایش سکه و ثبت خودکار در کلود بدون دستکاری user_balance
    balance = parseFloat((balance + rewardCoins).toFixed(4));
    updateBalanceDisplay();
    renderTasks();

    if (tg?.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
    showToast(`پاداش ${rewardCoins.toLocaleString()} سکه با موفقیت دریافت شد! 🎉`);
  }

    function getRefLink() {
      return `https://t.me/SimorApp_bot/simab?startapp=${gameId}`;
    }

    function copyRefLink() {
      const link = getRefLink();
      navigator.clipboard.writeText(link).then(() => {
        if (tg?.HapticFeedback) tg.HapticFeedback.impactOccurred('light');
        showToast('لینک دعوت اختصاصی شما کپی شد!');
      });
    }

    function shareTelegram() {
      const link = getRefLink();
      const text = encodeURIComponent(`سلام! در گیمینگ هاب سیماب عضو شو و با کد اختصاصی من ۵۰ سکه رایگان بگیر: ${link}`);
      const shareUrl = `https://t.me/share/url?url=${encodeURIComponent(link)}&text=${text}`;
      if (tg && tg.openTelegramLink) {
        tg.openTelegramLink(shareUrl);
      } else {
        window.open(shareUrl, '_blank');
      }
    }

    renderTasks();
  </script>
</body>
</html>
