<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>SIMAB | دستیار صوتی هوشمند</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg: #07070c;
      --card-bg: #12121c;
      --card-inner: #191928;
      --gold: #f5cf68;
      --gold-gradient: linear-gradient(135deg, #d4af37, #f9e8a2, #aa7c11);
      --purple-neon: #a855f7;
      --blue-neon: #38bdf8;
      --text: #ffffff;
      --text-muted: #9494a6;
      --border: rgba(212, 175, 55, 0.22);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; user-select: none; }
    
    body {
      background-color: #030306;
      color: var(--text);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      text-align: right;
    }

    .app-wrapper {
      width: 100%;
      max-width: 440px;
      min-height: 100vh;
      background: radial-gradient(circle at 50% 35%, #180d2a 0%, #07070c 80%);
      padding: 12px 14px 20px;
      display: flex;
      flex-direction: column;
      position: relative;
      box-shadow: 0 0 35px rgba(0,0,0,0.9);
    }

    /* هدر */
    .top-bar {
      display: flex; justify-content: space-between; align-items: center;
      background: var(--card-bg); border: 1px solid var(--border);
      border-radius: 14px; padding: 8px 12px; margin-bottom: 12px;
    }
    .btn-back {
      background: #20202e; color: var(--gold); border: 1px solid var(--border);
      padding: 6px 12px; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 13px;
    }
    .header-title { font-size: 14px; font-weight: bold; color: var(--gold); display: flex; align-items: center; gap: 6px; }

    /* وضعیت هوش مصنوعی */
    .status-badge {
      align-self: center; background: rgba(168, 85, 247, 0.12);
      border: 1px solid rgba(168, 85, 247, 0.35); color: #d8b4fe;
      padding: 4px 14px; border-radius: 20px; font-size: 11.5px; font-weight: bold;
      margin-bottom: 10px; display: flex; align-items: center; gap: 6px;
    }
    .pulse-dot {
      width: 8px; height: 8px; border-radius: 50%; background: var(--purple-neon);
      box-shadow: 0 0 8px var(--purple-neon); animation: pulse 1.5s infinite;
    }
    @keyframes pulse { 0% { opacity: 0.4; } 50% { opacity: 1; } 100% { opacity: 0.4; } }

    /* کانتینر کره نوری (Orb Canvas) */
    .orb-container {
      width: 100%;
      height: 250px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      margin-bottom: 10px;
    }
    #orbCanvas {
      width: 250px;
      height: 250px;
      border-radius: 50%;
    }

    /* کادر متن مکالمه */
    .dialogue-box {
      flex: 1; min-height: 120px; max-height: 160px;
      background: var(--card-bg); border: 1px solid var(--border);
      border-radius: 14px; padding: 12px; margin-bottom: 14px;
      display: flex; flex-direction: column; gap: 8px; overflow-y: auto; font-size: 12.5px; line-height: 1.5;
    }
    .user-bubble {
      background: #251b38; color: #f3e8ff; padding: 8px 12px; border-radius: 10px 10px 0 10px;
      align-self: flex-start; max-width: 85%; border: 1px solid rgba(168, 85, 247, 0.3);
    }
    .ai-bubble {
      background: var(--card-inner); color: #fff; padding: 8px 12px; border-radius: 10px 10px 10px 0;
      align-self: flex-end; max-width: 90%; border: 1px solid rgba(212, 175, 55, 0.25);
    }

    /* کلید اصلی میکروفون */
    .mic-control-area {
      display: flex; flex-direction: column; align-items: center; gap: 8px; margin-bottom: 10px;
    }
    .btn-mic {
      width: 68px; height: 68px; border-radius: 50%;
      background: radial-gradient(circle, #c084fc, #7e22ce);
      border: 3px solid rgba(255, 255, 255, 0.3);
      color: #fff; font-size: 28px; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 0 25px rgba(168, 85, 247, 0.6);
      transition: all 0.2s;
    }
    .btn-mic.listening {
      background: radial-gradient(circle, #f87171, #dc2626);
      box-shadow: 0 0 35px rgba(239, 68, 68, 0.85);
      animation: micPulse 1s infinite alternate;
    }
    @keyframes micPulse { from { transform: scale(1); } to { transform: scale(1.08); } }
    .mic-hint { font-size: 11px; color: var(--text-muted); }

    /* پیشنهادات گفتگو */
    .quick-chips {
      display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px;
    }
    .chip {
      background: var(--card-bg); border: 1px solid var(--border);
      padding: 6px 10px; border-radius: 16px; font-size: 11px; color: var(--gold);
      white-space: nowrap; cursor: pointer;
    }
    .chip:active { background: var(--card-inner); }
  </style>
</head>
<body>

  <div class="app-wrapper">
    <!-- هدر بالای صفحه -->
    <div class="top-bar">
      <button class="btn-back" onclick="goBack()">🔙 لابی</button>
      <div class="header-title">🎙️ دستیار هوشمند سیماب</div>
      <div style="font-size: 12px; color: var(--gold); font-weight: bold;">AI v2</div>
    </div>

    <!-- نشانگر وضعیت هوش مصنوعی -->
    <div class="status-badge" id="ai-status">
      <div class="pulse-dot" id="dot-indicator"></div>
      <span id="status-text">آماده شنیدن صدا</span>
    </div>

    <!-- کره نوری نئونی انیمیشنی (مشابه عکس‌های سیستم) -->
    <div class="orb-container">
      <canvas id="orbCanvas" width="500" height="500"></canvas>
    </div>

    <!-- کادر گفتگو و پاسخ‌ها -->
    <div class="dialogue-box" id="chatBox">
      <div class="ai-bubble">
        سلام! من دستیار هوشمند سیماب هستم. برای گفتگو دکمه میکروفون را لمس کنید و سوالتان را بپرسید 🌸
      </div>
    </div>

    <!-- پیشنهادات سریع -->
    <div class="quick-chips">
      <div class="chip" onclick="askPreset('وضعیت سکه‌های من چطوره؟')">🪙 موجودی سکه‌ها</div>
      <div class="chip" onclick="askPreset('چه بازی‌هایی داریم؟')">🎮 لیست بازی‌ها</div>
      <div class="chip" onclick="askPreset('چطور ژتون پوکر بگیرم؟')">🔄 نحوه سواپ</div>
    </div>

    <!-- کلید اصلی میکروفون -->
    <div class="mic-control-area">
      <button class="btn-mic" id="btnMic" onclick="toggleListening()">🎙️</button>
      <div class="mic-hint" id="micHint">برای صحبت لمس کنید</div>
    </div>
  </div>

  <script>
    const tg = window.Telegram?.WebApp;
    try {
      if (tg) {
        tg.ready();
        tg.expand();
        if (tg.BackButton) {
          tg.BackButton.show();
          tg.BackButton.onClick(goBack);
        }
      }
    } catch(e) {}

    function goBack() {
      window.location.href = '../index.html';
    }

    // خواندن موجودی برای پاسخ‌های هوش مصنوعی
    let userBalance = localStorage.getItem('user_balance') || '1,000';

    // انیمیشن سه‌بعدی و پالس‌های کره نوری (Visualizer Canvas)
    const canvas = document.getElementById('orbCanvas');
    const ctx = canvas.getContext('2d');
    let orbMode = 'idle'; // 'idle', 'listening', 'speaking'
    let angle = 0;

    function drawOrb() {
      ctx.clearRect(0, 0, 500, 500);
      const cx = 250, cy = 250;
      angle += (orbMode === 'listening' ? 0.04 : (orbMode === 'speaking' ? 0.03 : 0.015));

      // هاله بیرونی نرم
      const glowGrad = ctx.createRadialGradient(cx, cy, 30, cx, cy, orbMode === 'listening' ? 180 : 140);
      if (orbMode === 'listening') {
        glowGrad.addColorStop(0, 'rgba(239, 68, 68, 0.4)');
        glowGrad.addColorStop(0.5, 'rgba(168, 85, 247, 0.25)');
        glowGrad.addColorStop(1, 'rgba(0, 0, 0, 0)');
      } else if (orbMode === 'speaking') {
        glowGrad.addColorStop(0, 'rgba(56, 189, 248, 0.5)');
        glowGrad.addColorStop(0.6, 'rgba(168, 85, 247, 0.3)');
        glowGrad.addColorStop(1, 'rgba(0, 0, 0, 0)');
      } else {
        glowGrad.addColorStop(0, 'rgba(168, 85, 247, 0.35)');
        glowGrad.addColorStop(0.7, 'rgba(212, 175, 55, 0.15)');
        glowGrad.addColorStop(1, 'rgba(0, 0, 0, 0)');
      }
      ctx.fillStyle = glowGrad;
      ctx.beginPath();
      ctx.arc(cx, cy, 220, 0, Math.PI * 2);
      ctx.fill();

      // رسم حلقه‌های نئونی مداری چندگانه (Orb Rings)
      for (let i = 0; i < 4; i++) {
        ctx.save();
        ctx.translate(cx, cy);
        ctx.rotate(angle * (i % 2 === 0 ? 1 : -1) + (i * Math.PI / 4));
        
        ctx.beginPath();
        const rx = 85 + (i * 12) + (orbMode === 'listening' ? Math.sin(angle * 4 + i) * 15 : 0);
        const ry = 60 + (i * 8);
        ctx.ellipse(0, 0, rx, ry, (i * Math.PI) / 6, 0, Math.PI * 2);
        
        ctx.lineWidth = (i === 1 || i === 2) ? 3.5 : 2;
        if (orbMode === 'listening') {
          ctx.strokeStyle = i % 2 === 0 ? '#f87171' : '#f5cf68';
        } else if (orbMode === 'speaking') {
          ctx.strokeStyle = i % 2 === 0 ? '#38bdf8' : '#c084fc';
        } else {
          ctx.strokeStyle = i % 2 === 0 ? '#c084fc' : '#f5cf68';
        }
        ctx.shadowColor = ctx.strokeStyle;
        ctx.shadowBlur = 12;
        ctx.stroke();
        ctx.restore();
      }

      // هسته مرکزی پرانرژی
      ctx.beginPath();
      const coreR = 38 + (orbMode === 'speaking' ? Math.sin(angle * 6) * 8 : (orbMode === 'listening' ? Math.sin(angle * 8) * 10 : Math.sin(angle * 2) * 3));
      const coreGrad = ctx.createRadialGradient(cx, cy, 5, cx, cy, coreR);
      coreGrad.addColorStop(0, '#ffffff');
      coreGrad.addColorStop(0.4, orbMode === 'listening' ? '#ef4444' : '#a855f7');
      coreGrad.addColorStop(1, orbMode === 'speaking' ? '#0284c7' : '#d4af37');
      ctx.fillStyle = coreGrad;
      ctx.arc(cx, cy, coreR, 0, Math.PI * 2);
      ctx.fill();

      requestAnimationFrame(drawOrb);
    }
    drawOrb();

    // موتور تشخیص گفتار (Web Speech API)
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    let recognition = null;
    let isListening = false;

    if (SpeechRecognition) {
      recognition = new SpeechRecognition();
      recognition.lang = 'fa-IR'; // زبان فارسی
      recognition.continuous = false;
      recognition.interimResults = false;

      recognition.onstart = function() {
        isListening = true;
        orbMode = 'listening';
        document.getElementById('btnMic').classList.add('listening');
        document.getElementById('status-text').innerText = 'در حال شنیدن صدای شما...';
        document.getElementById('micHint').innerText = 'صحبت کنید...';
      };

      recognition.onresult = function(event) {
        const transcript = event.results[0][0].transcript;
        addBubble(transcript, 'user');
        processAIResponse(transcript);
      };

      recognition.onerror = function() {
        stopListeningState();
      };

      recognition.onend = function() {
        stopListeningState();
      };
    }

    function toggleListening() {
      if (!recognition) {
        alert('مرورگر شما از ورودی مستقیم صوتی پشتیبانی نمی‌کند. می‌توانید از دکمه‌های آماده زیر استفاده کنید.');
        return;
      }
      try {
        if (isListening) {
          recognition.stop();
          stopListeningState();
        } else {
          recognition.start();
        }
      } catch(e) {}
    }

    function stopListeningState() {
      isListening = false;
      if (orbMode === 'listening') orbMode = 'idle';
      document.getElementById('btnMic').classList.remove('listening');
      document.getElementById('status-text').innerText = 'آماده شنیدن صدا';
      document.getElementById('micHint').innerText = 'برای صحبت لمس کنید';
    }

    function addBubble(text, sender) {
      const box = document.getElementById('chatBox');
      const b = document.createElement('div');
      b.className = sender === 'user' ? 'user-bubble' : 'ai-bubble';
      b.innerText = text;
      box.appendChild(b);
      box.scrollTop = box.scrollHeight;
    }

    function askPreset(q) {
      addBubble(q, 'user');
      processAIResponse(q);
    }

    // مغز پاسخگوی دستیار سیماب
    function processAIResponse(query) {
      orbMode = 'speaking';
      document.getElementById('status-text').innerText = 'در حال پاسخگویی...';

      let reply = '';
      const q = query.toLowerCase();

      if (q.includes('سکه') || q.includes('موجودی') || q.includes('امتیاز')) {
        reply = `موجودی شما در حال حاضر ${userBalance} سکه سیماب است. برای کسب سکه بیشتر می‌توانید تسک‌ها را انجام دهید یا در گردونه روزانه شرکت کنید.`;
      } else if (q.includes('بازی') || q.includes('چی داریم')) {
        reply = 'در حال حاضر بازی‌های پوکر تگزاس، رول شانس (اسلات)، تخته نرد، حکم، ۲۱، منچ و مارپله در حال توسعه هستند.';
      } else if (q.includes('سواپ') || q.includes('تبدیل') || q.includes('ژتون')) {
        reply = 'در بخش سواپ می‌توانید سکه‌های سیماب را به ژتون پوکر تبدیل کنید و برعکس؛ همچنین امکان ارسال مستقیم سکه به دوستان هم وجود دارد.';
      } else if (q.includes('سلام') || q.includes('درود')) {
        reply = 'سلام دوست من! خوش اومدی به گیمینگ‌هاب سیماب. چطور می‌تونم راهنماییت کنم؟';
      } else if (q.includes('مدیر') || q.includes('استاد') || q.includes('حسینی')) {
        reply = 'پلتفرم سیماب با مدیریت استاد سید علی حسینی توسعه یافته است. برای پشتیبانی می‌توانید از بخش پشتیبانی تلگرام پیام ارسال کنید.';
      } else {
        reply = 'پیام شما دریافت شد. من همواره در کنار شما در مینی‌اپ سیماب هستم تا سوالات بازی‌ها و دارایی‌هایتان را بررسی کنم!';
      }

      setTimeout(() => {
        addBubble(reply, 'ai');
        speakText(reply);
      }, 700);
    }

    // موتور تلفظ صوتی پاسخ
    function speakText(text) {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const utter = new SpeechSynthesisUtterance(text);
        utter.lang = 'fa-IR';
        utter.rate = 1.0;
        utter.onend = function() {
          orbMode = 'idle';
          document.getElementById('status-text').innerText = 'آماده شنیدن صدا';
        };
        utter.onerror = function() {
          orbMode = 'idle';
          document.getElementById('status-text').innerText = 'آماده شنیدن صدا';
        };
        window.speechSynthesis.speak(utter);
      } else {
        setTimeout(() => {
          orbMode = 'idle';
          document.getElementById('status-text').innerText = 'آماده شنیدن صدا';
        }, 3000);
      }
    }
  </script>
</body>
</html>
