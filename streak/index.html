<!DOCTYPE html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>🎁 پاداش روزانه | سیماب</title><script src="https://telegram.org/js/telegram-web-app.js"></script><link rel="stylesheet" href="../assets/css/simab-common.css?v=10"><script src="../assets/js/simab-wallet-client.js?v=10"></script></head><body><main class="shell"><header class="page-head"><h1>🎁 پاداش روزانه</h1><a href="../index.html">خانه ←</a></header><div class="balances"><div>موجودی سکه<b data-coins>—</b></div><div>ژتون<b data-chips>—</b></div></div><section class="panel"><h2>هفت روز، هفت جایزه</h2><div class="chips-row" style="flex-wrap:wrap"><div style="min-width:62px;border:1px solid #78603a;border-radius:12px;padding:10px"><small>روز 1</small><strong style="color:#f6d08c">1 🪙</strong></div><div style="min-width:62px;border:1px solid #78603a;border-radius:12px;padding:10px"><small>روز 2</small><strong style="color:#f6d08c">2 🪙</strong></div><div style="min-width:62px;border:1px solid #78603a;border-radius:12px;padding:10px"><small>روز 3</small><strong style="color:#f6d08c">3 🪙</strong></div><div style="min-width:62px;border:1px solid #78603a;border-radius:12px;padding:10px"><small>روز 4</small><strong style="color:#f6d08c">4 🪙</strong></div><div style="min-width:62px;border:1px solid #78603a;border-radius:12px;padding:10px"><small>روز 5</small><strong style="color:#f6d08c">5 🪙</strong></div><div style="min-width:62px;border:1px solid #78603a;border-radius:12px;padding:10px"><small>روز 6</small><strong style="color:#f6d08c">7 🪙</strong></div><div style="min-width:62px;border:1px solid #78603a;border-radius:12px;padding:10px"><small>روز 7</small><strong style="color:#f6d08c">10 🪙</strong></div></div><p>زنجیرهٔ فعلی: <b id="streak">—</b> روز</p><p class="muted">هر روز UTC یک بار. با یک روز وقفه زنجیره از روز اول شروع می‌شود.</p><button id="claim" disabled>در حال اتصال…</button><p id="reward-result" class="status" role="status"></p></section><p class="muted">سکه‌ها مجازی‌اند؛ برداشت نقدی وجود ندارد. موجودی در تمام بخش‌های سیماب مشترک است.</p></main><script>let busy=false;SimabWallet.subscribe(s=>{document.getElementById('streak').textContent=s.streakDay;document.getElementById('claim').disabled=busy||!s.dailyAvailable;document.getElementById('claim').textContent=s.dailyAvailable?'دریافت جایزهٔ امروز':'✓ جایزهٔ امروز دریافت شد';});document.getElementById('claim').onclick=async()=>{if(busy)return;busy=true;document.getElementById('claim').disabled=true;try{const r=await SimabWallet.mutate('wallet',{walletAction:'daily',amount:0});document.getElementById('reward-result').textContent=r.duplicate||r.result?.alreadyClaimed?'این جایزه قبلاً دریافت شده.':r.rewardCoins.toLocaleString('fa-IR')+' سکه اضافه شد.';}catch(e){document.getElementById('reward-result').textContent=e.message;}finally{busy=false;document.getElementById('claim').disabled=!SimabWallet.state?.dailyAvailable;}};</script></body></html>
